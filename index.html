  /* ── 谶 · 青绿 design tokens ─────────────────────────── */
  :root{
    --bg0:#081512; --bg1:#0b1d19;
    --pane:rgba(220,235,224,.045); --pane2:rgba(220,235,224,.08);
    --line:rgba(198,234,214,.14); --line-2:rgba(198,234,214,.26);
    --ink:#dcebe0; --ink-2:#9db8a9; --ink-3:#6f8d7f;
    --jade:#7fc7a4; --jadeHi:#c6ead6; --jadeLo:#2e6b52; --jade-bg:rgba(127,199,164,.1);
    --gold:#d4a95c; --goldHi:#e8d9a8; --goldLo:#96793d; --gold-bg:rgba(212,169,92,.12);
    --seal:#c0392b; --sealHi:#e8604b;
    --paperA:#e9f0e2; --paperB:#c9dcc4; --paperInk:#1f4d43; --paperInk2:#3f6a5c;
    --f-han:"Hanzi Serif","Songti SC","Songti TC","STSong","SimSun","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK SC",serif;
    --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
    --f-clue:"Clue Serif",Didot,"Bodoni MT",Georgia,"Times New Roman",serif;
    --s1:6px; --s2:10px; --s3:14px; --s4:20px; --s5:28px;
    --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-lg:16px; --t-xl:20px; --t-2xl:26px;
    --ease:cubic-bezier(.2,.7,.3,1);
  }

  *{box-sizing:border-box;min-width:0}
  html{background:var(--bg0)}
  body{margin:0;background:var(--bg0);color:var(--ink)}

  /* ── 氛围层 ── */
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #fx .scene{position:absolute;inset:0;background:
    radial-gradient(75% 60% at 50% 118%, rgba(21,84,66,.42) 0%, transparent 62%),
    radial-gradient(120% 90% at 85% -10%, rgba(24,52,64,.5) 0%, transparent 55%),
    linear-gradient(var(--bg1),var(--bg0) 55%,var(--bg1))}
  #fx .bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;mix-blend-mode:screen}
  @media (prefers-reduced-motion:reduce){#fx .bgv{display:none}}
  #fx .vig{position:absolute;inset:0;background:radial-gradient(90% 85% at 50% 45%, transparent 55%, rgba(0,0,0,.4) 100%)}
  #fx .bloom{position:absolute;left:50%;top:46%;width:640px;height:640px;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(127,199,164,.12), transparent 70%);filter:blur(8px)}
  #fx .grain{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.018) 1px, transparent 1px);background-size:4px 4px}
  #fx .ghost{position:absolute;right:-.16em;bottom:-.28em;font-family:var(--f-han);font-weight:900;
    font-size:clamp(280px,46vw,560px);line-height:1;color:var(--jade);opacity:.045;filter:url(#inkbleed)}
  .corner{position:absolute;width:52px;height:52px;opacity:.4}
  .corner svg{width:100%;height:100%;stroke:var(--gold);fill:none;stroke-width:1.5}
  .c-tl{top:10px;left:10px}.c-tr{top:10px;right:10px;transform:rotate(90deg)}
  .c-br{bottom:10px;right:10px;transform:rotate(180deg)}.c-bl{bottom:10px;left:10px;transform:rotate(270deg)}
  #fx .embers i{position:absolute;bottom:-8px;border-radius:50%;opacity:0;
    background:radial-gradient(circle at 40% 40%, var(--goldHi), var(--gold) 70%, transparent)}
  @media (max-width:720px){#fx .ghost{opacity:.03}.corner{display:none}}

  /* ── 应用壳 ── */
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;
    font-family:var(--f-ui);font-size:var(--t-md);line-height:1.6;color:var(--ink);
    display:flex;flex-direction:column}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
    padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
    background:rgba(8,21,18,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .logo{display:flex;align-items:center;gap:11px}
  .logo b.sealogo{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:var(--f-han);font-weight:900;font-size:19px;color:#f2e3c0;
    transform:rotate(-4deg);position:relative;z-index:0}
  .logo b.sealogo:before{content:"";position:absolute;inset:0;z-index:-1;background:#ad3122;border-radius:2px;
    filter:url(#chop);box-shadow:inset 0 0 0 1.5px #ad3122, inset 0 0 0 2.5px rgba(242,227,192,.55), inset 0 0 0 8px #ad3122}
  .logo .wm{display:flex;flex-direction:column;line-height:1.35}
  .logo .wm b{font-size:12px;letter-spacing:.4em;color:var(--ink);font-weight:600}
  .logo .wm i{font-style:normal;font-size:8.5px;letter-spacing:.26em;color:var(--ink-3);text-transform:uppercase}
  .hr{display:flex;align-items:center;gap:var(--s2)}
  .help{width:28px;height:28px;flex:none;border:1px solid var(--line-2);border-radius:50%;
    background:transparent;color:var(--ink-2);font-family:var(--f-ui);font-size:14px;cursor:pointer;line-height:1}
  .help:hover{border-color:var(--jade);color:var(--jade)}
  #snd.muted{opacity:.4;text-decoration:line-through}
  .modes{display:flex;gap:4px;width:max-content;margin:0 auto var(--s4);
    background:var(--pane);border:1px solid var(--line);border-radius:999px;padding:4px}
  .modes button{font-family:var(--f-ui);font-size:var(--t-md);padding:9px 28px;border:0;border-radius:999px;
    background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap;line-height:1.2;
    transition:background .2s var(--ease),color .2s var(--ease)}
  .modes button:hover{color:var(--jadeHi)}
  .modes button[aria-selected="true"]{background:linear-gradient(170deg,#8fd1b0,#63b58e);color:#06231b;font-weight:600;
    box-shadow:0 3px 10px rgba(127,199,164,.25), inset 0 1px 0 rgba(255,255,255,.35)}
  .modes .cn{display:none}
  select{font-family:var(--f-ui);font-size:var(--t-sm);padding:5px 6px;border:1px solid var(--line-2);
    background:var(--bg1);color:var(--ink-2);border-radius:3px;max-width:112px}
  button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  main{flex:1;padding:var(--s4)}

  /* ── 开屏 ── */
  .in-mark{text-align:center;padding-top:44px}
  .in-seal{display:inline-flex;width:80px;height:80px;align-items:center;justify-content:center;
    font-family:var(--f-han);font-weight:900;font-size:46px;color:#f2e3c0;
    transform:rotate(-4deg);position:relative;z-index:0}
  .in-seal:before{content:"";position:absolute;inset:0;z-index:-1;background:#ad3122;border-radius:3px;
    filter:url(#chop) drop-shadow(0 10px 26px rgba(150,39,28,.3));
    box-shadow:inset 0 0 0 3px #ad3122, inset 0 0 0 5px rgba(242,227,192,.55), inset 0 0 0 18px #ad3122}
  .in-seal:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.6;background:
    radial-gradient(4px 3px at 12% 20%, rgba(8,21,18,.5) 40%, transparent 60%),
    radial-gradient(3px 4px at 88% 74%, rgba(8,21,18,.45) 40%, transparent 60%),
    radial-gradient(3px 3px at 74% 10%, rgba(8,21,18,.4) 40%, transparent 60%),
    radial-gradient(4px 3px at 20% 88%, rgba(8,21,18,.45) 40%, transparent 60%)}
  .in-en{display:block;margin-top:16px;font-size:12px;letter-spacing:.55em;color:var(--gold);text-transform:uppercase}
  .hero{text-align:center;padding:var(--s4) 0}
  .hero h1{margin:0 0 var(--s3);font-size:30px;font-weight:500;line-height:1.4;text-wrap:balance;
    font-family:var(--f-clue);font-style:italic;color:var(--ink)}
  .hero h1.lit{
    background:linear-gradient(105deg,var(--ink) 0%,var(--ink) 38%,var(--goldHi) 47%,var(--jadeHi) 53%,var(--ink) 62%,var(--ink) 100%);
    background-size:230% 100%;background-position:120% 0;
    -webkit-background-clip:text;background-clip:text;color:transparent}
  html[lang="zh"] .hero h1,html[lang="ja"] .hero h1{
    font-family:var(--f-han);font-weight:900;font-style:normal;font-size:27px;letter-spacing:.1em}
  .hero p{margin:0 auto;max-width:36ch;color:var(--ink-2);font-size:14.5px;line-height:1.9}
  .in-lang{display:flex;gap:24px;justify-content:center;margin:4px 0 40px}
  .in-lang button{background:none;border:0;padding:2px 0;font-family:var(--f-ui);font-size:var(--t-sm);
    color:var(--ink-3);cursor:pointer;letter-spacing:.03em;border-bottom:1px solid transparent}
  .in-lang button:hover{color:var(--ink)}
  .in-lang button.on{color:var(--jade);border-bottom-color:var(--jade)}

  /* ── 进度 ── */
  .lvl{display:flex;align-items:flex-end;gap:var(--s3);margin:0 2px var(--s2)}
  .lvl .g{flex:1;min-width:0;font-size:var(--t-xs);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  .lvl .n{font-size:var(--t-sm);font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap;line-height:1.2}
  .lvl .n b{color:var(--jadeHi);font-weight:600;font-size:19px}
  .lvl .track{margin-top:8px}
  .dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--line-2);display:block}
  .dot.on{background:var(--gold)}
  .track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px}
  .track i{display:block;height:100%;background:linear-gradient(90deg,var(--jadeLo),var(--jade));width:0;transition:width .45s var(--ease)}

  /* ── 谜面 ── */
  .quiz{background:var(--pane);border:1px solid var(--line);border-radius:12px;
    padding:26px var(--s4) 22px;text-align:center;margin-bottom:var(--s3);position:relative}
  .quiz:before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
  .quiz .k{font-size:var(--t-xs);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  .quiz .v{font-size:22px;font-weight:400;margin-top:6px;line-height:1.4;text-wrap:balance;
    font-family:var(--f-clue);font-style:italic;color:var(--ink)}
  .quiz .sub{font-size:var(--t-sm);color:var(--ink-3);margin-top:6px;letter-spacing:.06em}
  .mw{display:inline-block}
  .hw{display:inline-block}

  /* ── 教学 ── */
  .coach{background:var(--pane);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:4px;
    padding:var(--s2) var(--s3);margin-bottom:var(--s3);font-size:var(--t-sm);color:var(--ink-2);line-height:1.65}
  .coach b{color:var(--ink);font-weight:500}
  .lay3{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin-top:10px}
  .lay3 span{font-size:var(--t-sm);color:var(--ink-2)}
  .keys{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:6px}
  .key{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--ink-2)}
  .key i{width:16px;height:16px;flex:none;border-radius:3px;border:1px solid transparent}
  .key i.g{background:var(--jade-bg);border-color:var(--jade)}
  .key i.a{background:transparent;border-color:var(--gold)}
  .key i.n{background:var(--pane2);border-color:var(--line-2);opacity:.5}

  /* ── 规则弹层 ── */
  .sheet{position:fixed;inset:0;background:rgba(3,10,8,.6);z-index:30;display:flex;
    align-items:flex-end;justify-content:center}
  .sheetin{background:var(--bg1);border-top:1px solid var(--line-2);border-radius:12px 12px 0 0;
    padding:var(--s4);width:100%;max-width:480px;max-height:80vh;overflow-y:auto;
    box-shadow:0 -20px 60px rgba(0,0,0,.5)}
  .sheetin h3{margin:0 0 var(--s3);font-size:var(--t-xl);font-weight:500;color:var(--jadeHi)}
  .sheetin ol{margin:0 0 var(--s4);padding-left:20px;color:var(--ink-2);font-size:var(--t-sm);line-height:1.75}
  .sheetin ol li{margin-bottom:9px}
  .sheetin li b{color:var(--ink);font-weight:500}
  .sheetin .keys{margin:0 0 var(--s2)}
  .sheetin .btn{width:100%;margin-top:var(--s4)}
  @media (min-width:700px){
    .sheet{align-items:center;padding:24px}
    .sheetin{max-width:540px;border-radius:16px;border:1px solid var(--line-2);padding:30px 34px;
      box-shadow:0 30px 80px rgba(0,0,0,.6)}
  }

  /* ── 猜测行 ── */
  .rows{display:flex;flex-direction:column;gap:5px;margin-bottom:var(--s3);min-height:4px}
  .row{display:flex;align-items:center;gap:5px}
  .gt{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-2);border-radius:3px;background:var(--pane);
    font-family:var(--f-han);font-size:19px;color:var(--ink);line-height:1}
  .gt.g{border-color:var(--jade);background:var(--jade-bg);color:var(--jadeHi);box-shadow:0 0 10px rgba(127,199,164,.2)}
  .gt.a{border-color:var(--gold);color:var(--goldHi)}
  .gt.n{opacity:.4}
  .rl{font-size:var(--t-sm);color:var(--ink-3);margin-left:5px}
  .rl.g{color:var(--jade)} .rl.a{color:var(--gold)}
  .hintbox{border:1px dashed var(--goldLo);border-radius:4px;padding:var(--s2) var(--s3);
    font-size:var(--t-sm);color:var(--ink-2);line-height:1.7;background:var(--pane)}
  .hintbox .hk{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold);margin-bottom:3px}
  .obhint{width:52px;height:52px;color:var(--jadeHi);display:block;margin:var(--s2) auto 0}

  /* ── 拼字台 ── */
  .board{display:flex;align-items:center;justify-content:center;gap:var(--s2);margin-bottom:var(--s3);position:relative}
  .board.tb{flex-direction:column}
  .ringbg{position:absolute;left:50%;top:50%;width:340px;height:340px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}
  .ringbg svg{width:100%;height:100%;transform-origin:center}
  .rk1{stroke:var(--jade);opacity:.14}.rk2{stroke:var(--jade);opacity:.2}
  .rk3{stroke:var(--jade);opacity:.1}.rk4{stroke:var(--gold);opacity:.25}
  .shape{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:var(--s2);
    font-size:var(--t-sm);color:var(--ink-3)}
  .lay{width:18px;height:18px;color:var(--gold)}
  .op{font-size:16px;color:var(--ink-3)}
  .cell{width:70px;height:70px;flex:none;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;cursor:pointer;background:var(--pane);
    border:1px dashed var(--line-2);padding:0;font-family:inherit;color:inherit;border-radius:4px;z-index:1;overflow:hidden}
  .cell::before,.cell::after{content:"";position:absolute;background:var(--line-2);opacity:.4}
  .cell::before{left:9px;right:9px;top:50%;height:1px}
  .cell::after{top:9px;bottom:9px;left:50%;width:1px}
  .cell>*{position:relative;z-index:1}
  .go{display:block;width:100%;margin-bottom:var(--s4)}

  .tk-mk{position:absolute;right:-4px;bottom:-6px;font-size:46px;line-height:1;opacity:.26;
    filter:grayscale(1) brightness(1.55);pointer-events:none;user-select:none}
  .tk-mk .ic{width:44px;height:44px;display:block;color:var(--jadeHi)}
  .tk-mk.mk-svg{filter:none;opacity:.22}
  .py2{font-size:10px;line-height:1.3;color:var(--ink-3);letter-spacing:.05em;position:relative;z-index:1}
  .gl{font-family:var(--f-han);font-size:29px;line-height:1.2;color:var(--ink)}
  .gl.w{font-size:20px}
  .gs{font-size:9.5px;line-height:1.2;color:var(--ink-3);max-width:100%;padding:0 2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── 牌堆 ── */
  .tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tray button{height:82px;padding:5px 3px;position:relative;border-radius:10px;cursor:pointer;font-family:inherit;color:inherit;
    background:linear-gradient(170deg,#15241f,#0c1613);
    border:1px solid rgba(198,234,214,.16);
    box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 0 0 1px rgba(46,107,82,.35), inset 0 1px 0 rgba(198,234,214,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease)}
  .tray button:hover{transform:translateY(-3px);border-color:var(--jade);
    box-shadow:0 10px 20px rgba(0,0,0,.4), 0 0 14px rgba(127,199,164,.18), inset 0 0 0 1px var(--jadeLo)}
  .tray button.used{opacity:.3;pointer-events:none;transform:none}

  /* ── 揭示 ── */
  .rv-flash{position:fixed;inset:0;background:#eaf3e6;z-index:60;pointer-events:none;opacity:0}
  .rays{position:relative;height:0;z-index:0}
  .rays svg{position:absolute;left:50%;top:150px;width:420px;height:420px;transform:translate(-50%,-50%);pointer-events:none;opacity:0}
  .cheer{text-align:center;padding:var(--s4) 0 var(--s2);position:relative;z-index:1}
  .cheer .st{display:inline-block;font-family:var(--f-han);font-weight:900;font-size:18px;line-height:1;
    color:#f2e3c0;padding:9px 8px 8px;
    transform:rotate(-7deg);letter-spacing:.06em;position:relative;z-index:1}
  .cheer .st:before{content:"";position:absolute;inset:0;z-index:-1;background:#ad3122;border-radius:2px;
    filter:url(#chop) drop-shadow(0 4px 12px rgba(150,39,28,.4));
    box-shadow:inset 0 0 0 1.5px #ad3122, inset 0 0 0 3px rgba(242,227,192,.55), inset 0 0 0 9px #ad3122}
  .cheer.no .st:before{background:#45544c;
    box-shadow:inset 0 0 0 1.5px #45544c, inset 0 0 0 3px rgba(220,235,224,.4), inset 0 0 0 9px #45544c}
  .cheer .tx{margin-top:var(--s2);font-size:var(--t-lg);font-weight:500;color:var(--jadeHi);letter-spacing:.04em}
  .cheer .sb{font-size:var(--t-sm);color:var(--ink-3);margin-top:2px}
  .bigw{text-align:center;margin:var(--s2) 0 var(--s3);position:relative;z-index:1}
  .bigw .bg{font-family:var(--f-han);font-weight:900;font-size:96px;line-height:1.08;display:block;
    background:linear-gradient(168deg,var(--goldHi) 12%,var(--gold) 42%,var(--goldLo) 68%,var(--goldHi) 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 24px rgba(212,169,92,.25))}
  .bigw .bg.w{font-size:60px}
  .bigw .py{font-family:var(--f-clue);font-style:italic;font-size:18px;color:var(--ink);margin-top:var(--s1)}
  .bigw .mn{font-size:var(--t-lg);font-weight:500;margin-top:2px;color:var(--ink-2)}
  .rvtag{display:inline-block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    border:1px solid var(--goldLo);border-radius:2px;padding:1px 6px;margin-top:var(--s2);background:var(--gold-bg)}
  .acts{display:flex;gap:var(--s2);margin-top:var(--s4)}
  .acts .btn{flex:1}

  /* ── 字源卷轴 ── */
  .card{background:linear-gradient(174deg,var(--paperA),var(--paperB));border:0;border-radius:10px;
    padding:var(--s4) var(--s3) var(--s3);margin-bottom:var(--s3);color:var(--paperInk);position:relative;
    box-shadow:0 14px 40px rgba(0,0,0,.4), inset 0 0 0 1px rgba(31,77,67,.22), inset 0 0 30px rgba(120,150,110,.18)}
  .card:before,.card:after{content:"";position:absolute;left:-5px;right:-5px;height:10px;
    background:#33544a;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .card:before{top:-4px}.card:after{bottom:-4px}
  .card.miss{background:var(--pane2);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
  .card.miss:before,.card.miss:after{display:none}
  .card .hd{font-size:var(--t-lg);margin-bottom:3px;line-height:1.4}
  .card .hd em{font-family:var(--f-han);font-style:normal;font-size:26px;margin-right:6px}
  .card .hd i{font-style:normal;font-size:var(--t-md)}
  .card .bd{font-size:var(--t-sm);line-height:1.7;color:var(--paperInk)}
  .card.miss .bd{color:var(--ink-2)}
  .tag{float:right;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--paperInk2);
    border:1px solid var(--paperInk2);border-radius:2px;padding:1px 5px;margin-top:5px}
  .lore{margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid rgba(31,77,67,.25);
    font-size:var(--t-sm);line-height:1.75;color:var(--paperInk)}
  .lore .lk{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#8a1f12;margin-bottom:3px}
  .lore b{font-weight:600;color:#8a1f12}
  .split{display:flex;align-items:flex-start;justify-content:center;gap:var(--s3);margin:var(--s2) 0 var(--s1)}
  .split .op{margin-top:26px;color:var(--paperInk2)}
  .pt{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
  .pt b{font-family:var(--f-han);font-weight:900;font-size:26px;line-height:1.1;color:var(--paperInk)}
  .pt span{font-size:var(--t-sm);color:var(--paperInk2)}
  .ob{width:38px;height:38px;color:#8a1f12;display:block;margin-bottom:2px}
  .ob-x{display:block;width:38px;height:38px;margin-bottom:2px}
  .obl{text-align:center;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--paperInk2);margin-bottom:var(--s3)}
  .share{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t-sm);line-height:1.6;
    background:rgba(31,77,67,.08);border:1px solid rgba(31,77,67,.2);border-radius:3px;padding:8px 10px;margin:var(--s2) 0;color:var(--paperInk)}

  /* ── 法箓（图鉴）── */
  .cap{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
    font-size:var(--t-xs);letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3);margin:var(--s4) 0 var(--s2)}
  .cap button{font-family:var(--f-ui);font-size:var(--t-xs);letter-spacing:.04em;text-transform:none;
    padding:3px 9px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer;border-radius:3px}
  .coll{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .coll div{height:44px;display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:1px solid var(--line);border-radius:4px;background:var(--pane);
    font-family:var(--f-han);font-size:19px;color:var(--ink);line-height:1}
  .coll div.got{border-color:rgba(127,199,164,.5);background:var(--jade-bg);color:var(--jadeHi);
    box-shadow:inset 0 0 10px rgba(127,199,164,.08)}
  .coll div.w{font-size:11px}
  .coll div.lock{background:transparent;color:var(--ink-3);opacity:.4;font-size:13px;font-family:var(--f-ui)}
  .strip{display:flex;gap:7px;justify-content:flex-start;margin:0 2px var(--s4)}
  .chip{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-2);border-radius:50%;font-size:var(--t-sm);color:var(--ink-3);background:transparent;
    transition:border-color .15s,color .15s}
  .chip:hover{border-color:var(--jade);color:var(--jade)}
  .chip.ok{border-color:var(--jadeLo);color:var(--jade);background:var(--jade-bg)}
  .chip.now{border-color:var(--gold);color:#06231b;background:var(--gold)}
  .chip.soon{opacity:.4;border-style:dashed}

  .relicbox{background:var(--pane);border:1px solid var(--line);border-radius:12px;
    padding:10px 10px 12px;margin-bottom:var(--s3);text-align:center}
  #relic{height:220px;cursor:grab;touch-action:pan-y}
  #relic:active{cursor:grabbing}
  #relic canvas{display:block;margin:0 auto;border-radius:8px}
  .reliccap{font-size:var(--t-xs);letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-top:8px}
  .relicwhy{font-size:var(--t-sm);color:var(--ink-3);margin-top:5px}
  .relicshelf{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .relicshelf span{font-size:11px;color:var(--ink-3);border:1px solid var(--line);
    padding:3px 10px;border-radius:99px;opacity:.6}
  .relicshelf span.on{color:var(--gold);border-color:var(--goldLo);background:var(--gold-bg);opacity:1}
  .done{background:linear-gradient(174deg,var(--paperA),var(--paperB));border:0;border-radius:10px;
    padding:var(--s4) var(--s3);margin-bottom:var(--s3);color:var(--paperInk);
    box-shadow:0 14px 40px rgba(0,0,0,.4), inset 0 0 0 1px rgba(31,77,67,.22)}
  .done h3{margin:0 0 var(--s1);font-size:var(--t-xl);font-weight:500}
  .done p{margin:0 0 var(--s3);font-size:var(--t-sm);color:var(--paperInk2);line-height:1.65}

  /* ── 按钮 ── */
  .btn{font-family:var(--f-ui);font-size:var(--t-md);padding:13px 18px;border:1px solid var(--jade);
    background:linear-gradient(170deg,#8fd1b0,#63b58e);color:#06231b;font-weight:600;cursor:pointer;border-radius:9px;
    box-shadow:0 6px 18px rgba(127,199,164,.2), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(127,199,164,.28), inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.ghost{background:transparent;color:var(--jadeHi);border-color:var(--line-2);box-shadow:none;font-weight:400}
  .btn.ghost:hover{border-color:var(--jade)}
  .btn[disabled]{opacity:.3;cursor:default;transform:none;box-shadow:none}
  .done .btn.ghost{color:var(--paperInk);border-color:var(--paperInk2)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--jadeHi);color:#06231b;font-size:var(--t-sm);padding:8px 16px;border-radius:20px;
    opacity:0;pointer-events:none;z-index:20;transition:opacity .2s,transform .2s var(--ease)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{padding:var(--s3) var(--s4) var(--s5);border-top:1px solid var(--line);
    font-size:var(--t-sm);color:var(--ink-3);text-align:center}

  /* ── PC 布局 ── */
  @media (min-width:1000px){
    .app{max-width:980px}

/*<Q>*/var Q=[{"a":"日","b":"月","w":"明","py":"míng","ic":"🔆","c":0,"q":{"en":"bright","es":"brillante"},"s":{"en":"The two brightest things in the sky, stacked.","zh":"把天上最亮的两样东西叠在一起。","ja":"空で最も明るい二つを重ねました。","es":"Las dos cosas más brillantes del cielo, juntas."},"t":["日","月","水","火"]},{"a":"木","b":"木","w":"林","py":"lín","ic":"§林","c":0,"q":{"en":"woods","es":"bosque"},"s":{"en":"One more tree.","zh":"再加一棵树。","ja":"木をもう一本。","es":"Un árbol más."}},{"a":"木","b":"林","w":"森","py":"sēn","ic":"§森","c":0,"q":{"en":"forest","es":"selva"},"s":{"en":"Three trees — but 森 does not mean many trees. It means dense enough to go dark.","zh":"三棵树 —— 但「森」不是树多，是密到发暗。","ja":"木が三本。ただし「森」は数ではなく、暗くなるほどの密さです。","es":"Tres árboles, pero 森 no es cantidad: es tan denso que oscurece."}},{"a":"火","b":"火","w":"炎","py":"yán","ic":"§炎","c":0,"q":{"en":"blaze","es":"llama"},"s":{"en":"Fire on top of fire.","zh":"火叠着火。","ja":"火の上に火。","es":"Fuego sobre fuego."}},{"a":"小","b":"土","w":"尘","py":"chén","ic":"§尘","c":0,"q":{"en":"dust","es":"polvo"},"s":{"en":"Small earth.","zh":"小的土。","ja":"小さい土。","es":"Tierra pequeña."}},{"a":"小","b":"大","w":"尖","py":"jiān","ic":"§尖","c":0,"q":{"en":"a point, a tip","es":"punta"},"s":{"en":"Small on top of big. The character is a drawing of a triangle.","zh":"上小下大。这个字就是一个三角形的图。","ja":"上が小さく下が大きい。字そのものが三角形です。","es":"Pequeño sobre grande: el carácter es el dibujo de un triángulo."}},{"a":"水","b":"目","w":"泪","py":"lèi","ic":"😢","c":0,"q":{"en":"a tear","es":"lágrima"},"s":{"en":"Water at the eye. Those three strokes on the left are 水 squeezed thin — you will see them on every liquid.","zh":"眼睛上的水。左边那三点是被挤扁的「水」，所有跟液体有关的字都带着它。","ja":"目のところの水。左の三点は「水」です。","es":"Agua en el ojo. Los tres trazos son 水 comprimido."}},{"a":"火","b":"山","w":"火山","py":"huǒshān","ic":"🌋","c":1,"q":{"en":"volcano","es":"volcán"},"s":{"en":"Fire mountain. English borrowed Vulcan, a Roman god — you need mythology to see it.","zh":"火的山。英文 volcano 来自罗马火神 Vulcan，你得先懂神话。","ja":"火の山。","es":"Montaña de fuego."}},{"a":"山","b":"水","w":"山水","py":"shānshuǐ","ic":"🏔️","c":1,"q":{"en":"landscape","es":"paisaje"},"s":{"en":"Mountain water. Also the name of an entire painting tradition.","zh":"山，和水。也是一整个画种的名字。","ja":"山と水。","es":"Montaña y agua."}},{"a":"森","b":"林","w":"森林","py":"sēnlín","ic":"🌲","c":1,"q":{"en":"forest (the word)","es":"bosque (palabra)"},"s":{"en":"The two characters you solved earlier now make a word.","zh":"你前面解开的两个字，现在拼成一个词。","ja":"先ほどの二字が単語になります。","es":"Los dos caracteres que resolviste forman una palabra."}},{"a":"明","b":"月","w":"明月","py":"míngyuè","ic":"🌕","c":1,"q":{"en":"a bright moon","es":"luna clara"},"s":{"en":"Two of the most common characters in Chinese poetry.","zh":"中文诗里出现最多的两个字之一。","ja":"漢詩に最も多く現れる語。","es":"De los más frecuentes en la poesía china."}},{"a":"明","b":"日","w":"明日","py":"míngrì","ic":"📅","c":1,"q":{"en":"tomorrow","es":"mañana"},"s":{"en":"Bright day. The written way to say tomorrow.","zh":"明，和日。书面一点的「明天」。","ja":"日本語と同じ書き方。","es":"Día brillante."}},{"a":"尘","b":"土","w":"尘土","py":"chéntǔ","ic":"🟫","c":1,"q":{"en":"dust (the word)","es":"polvo (palabra)"},"s":{"en":"Dust and earth.","zh":"尘，和土。","ja":"ちりと土。","es":"Polvo y tierra."}},{"a":"人","b":"木","w":"休","py":"xiū","ic":"😴","c":2,"q":{"en":"to rest","es":"descansar"},"s":{"en":"A person leaning against a tree.","zh":"一个人靠在一棵树上。","ja":"人が木にもたれている。","es":"Una persona apoyada en un árbol."}},{"a":"人","b":"人","w":"从","py":"cóng","ic":"👣","c":2,"q":{"en":"to follow","es":"seguir"},"s":{"en":"One person walking behind another.","zh":"一个人走在另一个人后面。","ja":"人が人の後ろを歩く。","es":"Una persona detrás de otra."}},{"a":"女","b":"子","w":"好","py":"hǎo","ic":"👍","c":2,"q":{"en":"good","es":"bueno"},"s":{"en":"A woman and a child.","zh":"一个女人，一个孩子。","ja":"女と子。","es":"Una mujer y un niño."}},{"a":"手","b":"目","w":"看","py":"kàn","ic":"👀","c":2,"q":{"en":"to look","es":"mirar"},"s":{"en":"A hand above an eye — the gesture you make to see into the distance.","zh":"手搭在眼睛上方 —— 遮着阳光往远处望的那个动作。","ja":"手を目の上に。遠くを見る仕草です。","es":"Una mano sobre el ojo, el gesto de mirar lejos."}},{"a":"门","b":"口","w":"问","py":"wèn","ic":"❓","c":2,"q":{"en":"to ask","es":"preguntar"},"s":{"en":"Careful — 门 here is not a door. It is the sound. mén gives you wèn; only 口 mouth carries the meaning.","zh":"注意 —— 这里的「门」不表示门，表示读音。mén 给出 wèn；只有「口」管意思。","ja":"注意：ここの「门」は意味ではなく音（mén → wèn）です。","es":"Ojo: 门 no es puerta, es el sonido. Solo 口 aporta significado."}},{"a":"门","b":"耳","w":"闻","py":"wén","ic":"👃","c":2,"q":{"en":"to hear of, to smell","es":"oler"},"s":{"en":"Same trick as 问. 耳 ear carries the meaning; 门 only supplies the sound, mén → wén.","zh":"和「问」一个套路。「耳」管意思，「门」只提供读音 mén → wén。","ja":"「问」と同じ仕組みです。","es":"El mismo truco que 问."}},{"a":"门","b":"马","w":"闯","py":"chuǎng","ic":"💨","c":2,"q":{"en":"to burst in","es":"irrumpir"},"s":{"en":"A horse coming out through a gate. This one really is a picture.","zh":"一匹马从门里冲出来。这个字是真的画面。","ja":"門から馬が飛び出す。これは本当に絵です。","es":"Un caballo saliendo por la puerta. Este sí es un dibujo."}},{"a":"忄","b":"亡","w":"忙","py":"máng","ic":"😵‍💫","c":2,"q":{"en":"busy","es":"ocupado"},"s":{"en":"Heart on the left, 亡 on the right. You have probably seen what people say this means.","zh":"左边是心，右边是「亡」。你大概见过网上怎么解释这个字。","ja":"左が心、右が「亡」。ネットでの説明を見たことがあるかもしれません。","es":"Corazón a la izquierda, 亡 a la derecha. Seguro has visto lo que dicen que significa."}},{"a":"人","b":"口","w":"人口","py":"rénkǒu","ic":"👥","c":3,"q":{"en":"population","es":"población"},"s":{"en":"The number of mouths to feed.","zh":"要养活的嘴的数量，就是人口。","ja":"養う口の数。","es":"Las bocas que alimentar."}},{"a":"小","b":"心","w":"小心","py":"xiǎoxīn","ic":"⚠️","c":3,"q":{"en":"be careful","es":"ten cuidado"},"s":{"en":"Small heart. Nothing in the English hints at either part.","zh":"小的心。英文 careful 里没有任何一个音节暗示「小」或「心」。","ja":"小さい心。","es":"Corazón pequeño."}},{"a":"水","b":"目","w":"泪水","py":"lèishuǐ","ic":"😭","c":3,"q":{"en":"tears","es":"lágrimas"},"s":{"en":"Tear water. Careful — the parts are not what you think.","zh":"泪，和水。注意别拼错了。","ja":"涙の水。","es":"Agua de lágrimas."}},{"a":"明","b":"白","w":"明白","py":"míngbai","ic":"💡","c":3,"q":{"en":"to understand","es":"entender"},"s":{"en":"Bright plus white. The character you built in chapter one, used again.","zh":"明 加 白。你第一章造的那个字，又用上了。","ja":"明＋白。第1章で作った字がまた出てきます。","es":"Brillante más blanco. El carácter que construiste en el capítulo uno."}},{"a":"出","b":"口","w":"出口","py":"chūkǒu","ic":"🚪","c":3,"q":{"en":"the exit","es":"la salida"},"s":{"en":"Go out, plus mouth. A mouth is any opening, not just the one on your face.","zh":"出，加口。「口」是任何一个开口，不只是脸上那个。","ja":"出＋口。「口」は顔の口だけでなく、あらゆる開口部です。","es":"Salir más boca. Una boca es cualquier abertura, no solo la de tu cara."}},{"a":"东","b":"西","w":"东西","py":"dōngxi","ic":"📦","c":3,"q":{"en":"a thing, stuff","es":"una cosa"},"s":{"en":"East plus west. That is the ordinary Chinese word for a thing.","zh":"东 加 西。这就是中文里最普通的那个「东西」。","ja":"東＋西。これが中国語で「もの」を指す日常語です。","es":"Este más oeste. Esa es la palabra china corriente para una cosa."}},{"a":"银","b":"河","w":"银河","py":"yínhé","ic":"🌌","c":4,"q":{"en":"the milky way","es":"vía láctea"},"s":{"en":"Silver river. English sees milk; Chinese sees silver. Same band of stars, two different minds.","zh":"银 ＋ 河。英文管它叫「牛奶路」，中文看见的是银子。同一条东西，两边想的完全不一样。","ja":"銀の川。英語は「ミルク」、日本語は「天の川」。","es":"Río de plata. El inglés ve leche; el chino ve plata."},"t":["银","河","奶","路","星","天","白","水"]},{"a":"电","b":"影","w":"电影","py":"diànyǐng","ic":"🎬","c":4,"q":{"en":"a movie","es":"película"},"s":{"en":"Electric shadow. English named the motion; Chinese named the shadow.","zh":"电 ＋ 影。英文 movie 的词根是「动」，中文选的是「影」。一百年前造的词，今天看还是准的。","ja":"電気の影。日本語は「映画」。","es":"Sombra eléctrica."},"t":["电","影","光","画","声","火","车","快"]},{"a":"火","b":"车","w":"火车","py":"huǒchē","ic":"🚂","c":4,"q":{"en":"a train","es":"tren"},"s":{"en":"Fire vehicle. More honest than English train, which just means to drag.","zh":"火 ＋ 车。英文 train 的意思其实是「拖拽」，中文选的是驱动它的东西。","ja":"火の車。","es":"Vehículo de fuego."},"t":["火","车","铁","快","长","马","路","大"]},{"a":"河","b":"马","w":"河马","py":"hémǎ","ic":"🦛","c":4,"q":{"en":"a hippopotamus","es":"hipopótamo"},"s":{"en":"River horse. Hippopotamus is Greek for river horse too — Chinese just does not make you learn Greek first.","zh":"河 ＋ 马。有意思的是 hippopotamus 在希腊语里也是「河马」，只是你得先会希腊语才看得见。","ja":"川の馬。","es":"Caballo de río."},"t":["河","马","水","牛","大","猪","山","长"]},{"a":"松","b":"鼠","w":"松鼠","py":"sōngshǔ","ic":"🐿️","c":4,"q":{"en":"a squirrel","es":"ardilla"},"s":{"en":"Pine mouse. Chinese named where it lives; English borrowed Greek for shadow-tail.","zh":"松 ＋ 鼠。中文按它住哪儿命名；英文 squirrel 来自希腊语「影子尾巴」。","ja":"松のねずみ。","es":"Ratón de pino."},"t":["松","鼠","木","猫","小","山","长","大"]},{"a":"袋","b":"鼠","w":"袋鼠","py":"dàishǔ","ic":"🦘","c":4,"q":{"en":"a kangaroo","es":"canguro"},"s":{"en":"Pocket mouse. Once you have 鼠, half the animal kingdom opens up.","zh":"袋 ＋ 鼠。有了「鼠」这块，半个动物园都能拼出来。","ja":"袋のねずみ。","es":"Ratón de bolsa."},"t":["袋","鼠","跳","大","马","长","山","水"]},{"a":"海","b":"豚","w":"海豚","py":"hǎitún","ic":"🐬","c":4,"q":{"en":"a dolphin","es":"delfín"},"s":{"en":"Sea pig. Not a fish, and Chinese says so. Careful: sea + fish is also a real word.","zh":"海 ＋ 豚。中文认得清它不是鱼。注意：海 + 鱼 也是真词（海鱼）。","ja":"海の豚。","es":"Cerdo de mar."},"t":["海","豚","鱼","水","猪","大","马","长"]},{"a":"熊","b":"猫","w":"熊猫","py":"xióngmāo","ic":"🐼","c":4,"q":{"en":"a panda","es":"panda"},"s":{"en":"Bear cat. English took the word from Nepali; Chinese just described it.","zh":"熊 ＋ 猫。英文 panda 借自尼泊尔语，是个音；中文直接说它长什么样。","ja":"熊の猫。","es":"Oso gato."},"t":["熊","猫","黑","白","大","竹","山","马"]},{"a":"火","b":"鸡","w":"火鸡","py":"huǒjī","ic":"🦃","c":4,"q":{"en":"a turkey","es":"pavo"},"s":{"en":"Fire chicken, for the red wattle. English named it after a country it never came from.","zh":"火 ＋ 鸡 —— 说的是它脖子上那团红。英文 turkey 是拿一个跟它毫无关系的国家命名的。","ja":"火の鶏。","es":"Pollo de fuego."},"t":["火","鸡","鸟","肉","大","山","土","红"]},{"a":"眼","b":"镜","w":"眼镜","py":"yǎnjìng","ic":"👓","c":4,"q":{"en":"glasses","es":"gafas"},"s":{"en":"Eye mirror. Note 眼 and 目 both mean eye — 目 is the ancient one, 眼 is the one you use.","zh":"眼 ＋ 镜。注意 眼 和 目 都是眼睛：目 是古的那个，眼 是你日常用的那个。","ja":"目の鏡。","es":"Espejo de ojo."},"t":["眼","镜","目","水","面","小","光","白"]},{"a":"地","b":"铁","w":"地铁","py":"dìtiě","ic":"🚇","c":4,"q":{"en":"the subway, the metro","es":"metro"},"s":{"en":"Ground iron. English named the tunnel; Chinese named the rails. Three traps here are real words.","zh":"地 ＋ 铁。英文说的是「地下的路」，中文说的是「地下的铁」。这题三个陷阱都是真词。","ja":"地の鉄。","es":"Hierro de tierra."},"t":["地","铁","车","下","路","道","火","快"]},{"a":"电","b":"脑","w":"电脑","py":"diànnǎo","ic":"💻","c":4,"q":{"en":"a computer","es":"ordenador"},"s":{"en":"Electric brain. English named the job; Chinese named the organ it replaces.","zh":"电 ＋ 脑。英文 computer 说的是「计算的东西」，中文说的是「电做的脑子」。","ja":"電気の脳。","es":"Cerebro eléctrico."},"t":["电","脑","机","心","手","子","快","小"]},{"a":"冰","b":"箱","w":"冰箱","py":"bīngxiāng","ic":"🧊","c":4,"q":{"en":"a fridge","es":"nevera"},"s":{"en":"Ice box. English called it that too, a century ago, then changed its mind.","zh":"冰 ＋ 箱。英文一百年前也叫它 icebox，后来改口了，中文没改。","ja":"氷の箱。","es":"Caja de hielo."},"t":["冰","箱","冷","水","门","白","小","大"]},{"a":"口","b":"红","w":"口红","py":"kǒuhóng","ic":"💄","c":4,"q":{"en":"lipstick","es":"lápiz labial"},"s":{"en":"Mouth red. English named the object; Chinese named the result.","zh":"口 ＋ 红。英文说的是那根「棒」，中文说的是抹上去之后的「红」。","ja":"口の赤。","es":"Rojo de boca."},"t":["口","红","笔","色","美","手","小","白"]},{"a":"女","b":"马","w":"妈","py":"mā","ic":"👩‍👧","c":5,"q":{"en":"mom","es":"mamá"},"s":{"en":"Woman for the meaning, horse for the sound: mǎ bends into mā. The horse says nothing about mothers.","zh":"女表意，马表音：mǎ 转个调就是 mā。马和妈妈没有任何关系。","ja":"女が意味、馬は音（mǎ→mā）。馬に母の意味はありません。","es":"Mujer da el sentido; caballo, solo el sonido: mǎ se dobla en mā."}},{"a":"口","b":"鸟","w":"鸣","py":"míng","ic":"🎵","c":5,"q":{"en":"a bird call","es":"el canto de un ave"},"s":{"en":"A mouth and a bird. What a bird does with its mouth.","zh":"口和鸟。鸟用嘴做的那件事。","ja":"口と鳥。鳥が口ですることです。","es":"Una boca y un pájaro. Lo que hace un pájaro con la boca."}},{"a":"口","b":"马","w":"吗","py":"ma","ic":"🗨️","c":5,"q":{"en":"the spoken question mark","es":"el signo de interrogación hablado"},"s":{"en":"Mouth for the meaning, 马 for the sound. Hang it on the end of any sentence and the sentence becomes a question.","zh":"口表意，马表音。挂在任何句子后面，句子就变成了问句。","ja":"口が意味、馬が音。文末に付けるだけで疑問文になります。","es":"Boca para el sentido, 马 para el sonido. Cuélgalo al final y la frase se vuelve pregunta."}},{"a":"火","b":"土","w":"灶","py":"zào","ic":"♨️","c":5,"q":{"en":"the kitchen stove","es":"el fogón"},"s":{"en":"Fire on earth — the earthen hearth every old kitchen was built around.","zh":"火加土——老厨房里那座土灶。","ja":"火と土。昔の台所の中心にあった竈です。","es":"Fuego sobre tierra: el fogón de barro de toda cocina antigua."}},{"a":"门","b":"人","w":"闪","py":"shǎn","ic":"🌩️","c":5,"q":{"en":"to dodge; a flash","es":"esquivar; un destello"},"s":{"en":"A person slipping through a doorway — there and gone.","zh":"一个人从门里侧身而过——一晃就没了。","ja":"人が門をすり抜ける——一瞬で消えます。","es":"Una persona escurriéndose por la puerta: aparece y desaparece."}},{"a":"门","b":"心","w":"闷","py":"mèn","ic":"😮‍💨","c":5,"q":{"en":"stuffy; bored","es":"sofocante; aburrido"},"s":{"en":"A heart shut inside a door. And 门 lends the sound too: mén → mèn.","zh":"心被关在门里。门还同时表音：mén → mèn。","ja":"心が門の中に。門は音も担当します（mén→mèn）。","es":"Un corazón encerrado tras una puerta. Y 门 presta también el sonido."}}];/*</Q>*/

 xing:{en:'phono-semantic',zh:'形声',ja:'形声',es:'fono-semántico'},

/*<EX>*/var EX={"明":{"k":"hui","s":{"en":"The two brightest things in the sky, stacked.","zh":"把天上最亮的两样东西叠在一起。","ja":"空で最も明るい二つを重ねました。","es":"Las dos cosas más brillantes del cielo, juntas."},"x":{"en":"Chinese then uses this character for understanding: 明白, bright + white, means \"I get it\". English reaches for the same thing without noticing — I see, it is clear to me, that sheds light on it. Two unrelated languages, one instinct: knowing is light.","zh":"中文接着用它表示「懂了」：明白。英语其实干了一模一样的事而自己没发觉 —— I see、it is clear、that sheds light on it。两门毫无关系的语言，同一个直觉：懂得就是看见光。","ja":"中国語はこの字で「わかる」を表します：明白。英語も I see と言います。理解は光。","es":"Luego el chino usa este carácter para entender: 明白, brillante + blanco. El inglés hace lo mismo: I see, it is clear."}},"林":{"k":"hui","s":{"en":"One more tree.","zh":"再加一棵树。","ja":"木をもう一本。","es":"Un árbol más."},"x":{"en":"English needs three unrelated words for this — tree, woods, forest — and none of them look like the others. Chinese just draws another tree. Same move elsewhere: 人 person → 从 follow → 众 crowd.","zh":"英语在这里需要三个毫不相干的词 —— tree、woods、forest，谁也不像谁。中文只是又画了一棵树。同一招还用在：人 → 从 → 众。","ja":"英語は tree、woods、forest と無関係な三語が必要です。中国語は木を増やすだけ。","es":"El inglés necesita tres palabras sin relación: tree, woods, forest. El chino solo dibuja otro árbol."}},"森":{"k":"hui","s":{"en":"Three trees — but 森 does not mean many trees. It means dense enough to go dark.","zh":"三棵树 —— 但「森」不是树多，是密到发暗。","ja":"木が三本。ただし「森」は数ではなく、暗くなるほどの密さです。","es":"Tres árboles, pero 森 no es cantidad: es tan denso que oscurece."},"x":{"en":"So 阴森 means eerie and 森严 means forbidding. English feels it too — every fairy tale sends the child into the woods, never into the trees. Chinese just put the dread inside the character.","zh":"所以「阴森」是疹人，「森严」是让人不敢靠近。英语里也有这个感觉 —— 每个童话都把孩子送进 into the woods，从来不是 into the trees。中文把那份发毛直接写进了字里。","ja":"だから「阴森」は不気味。英語も童話では into the woods と言います。","es":"Por eso 阴森 es siniestro. En inglés los cuentos mandan al niño into the woods, nunca into the trees."}},"炎":{"k":"hui","s":{"en":"Fire on top of fire.","zh":"火叠着火。","ja":"火の上に火。","es":"Fuego sobre fuego."},"x":{"en":"You will meet this at the doctor: 发炎 is inflammation, 肺炎 is pneumonia. Now look at the English word: inflammation comes from Latin flamma, flame. Two civilisations looked at a swollen joint and both said: fire.","zh":"你会在医院遇到它：发炎、肺炎。现在看英文那个词 —— inflammation 来自拉丁语 flamma，火焰。两个文明看着同一个肿痛的关节，都说：火。","ja":"病院で出会います：发炎、肺炎。英語の inflammation もラテン語の「炎」からです。","es":"Lo verás en medicina: 发炎. Y inflamación viene del latín flamma: llama. Dos civilizaciones dijeron fuego."}},"尘":{"k":"hui","s":{"en":"Small earth.","zh":"小的土。","ja":"小さい土。","es":"Tierra pequeña."},"x":{"en":"The older form is 塵 — a deer 鹿 standing on earth 土: the cloud thrown up by a running herd. Someone three thousand years ago decided dust was best explained by animals you could hear coming.","zh":"更早的写法是「塵」—— 上面一头鹿，下面一块土：鹿群奔跑扬起的那片土。三千年前有人决定，解释「尘」最好的方式是一群你能听见的动物。","ja":"古い形は「塵」。鹿の群れが巶き上げる土ぼこりです。","es":"La forma antigua es 塵: un ciervo sobre tierra, el polvo que levanta la manada."}},"尖":{"k":"hui","s":{"en":"Small on top of big. The character is a drawing of a triangle.","zh":"上小下大。这个字就是一个三角形的图。","ja":"上が小さく下が大きい。字そのものが三角形です。","es":"Pequeño sobre grande: el carácter es el dibujo de un triángulo."},"x":{"en":"This one is a newcomer — the great Han-dynasty dictionary does not have it. For centuries the word for sharp was a complicated character nobody enjoyed writing. Someone drew the obvious picture instead, and everyone quietly switched.","zh":"这是个新字 —— 汉代的《说文解字》里根本没有它。古人说「尖」用的是一个没人愿意写的复杂字。后来有人直接画了那个显而易见的图，大家就默默换了过去。","ja":"新しい字で、『説文解字』にはありません。誰かが絵を描いて定着しました。","es":"Es tardío: el gran diccionario Han no lo tiene. Alguien dibujó lo obvio y todos cambiaron."}},"泪":{"k":"hui","s":{"en":"Water at the eye. Those three strokes on the left are 水 squeezed thin — you will see them on every liquid.","zh":"眼睛上的水。左边那三点是被挤扁的「水」，所有跟液体有关的字都带着它。","ja":"目のところの水。左の三点は「水」です。","es":"Agua en el ojo. Los tres trazos son 水 comprimido."},"x":{"en":"Try it right now on any character with those three strokes: 河 river, 海 sea, 汗 sweat, 酒 alcohol. Four for four. This is the closest thing Chinese has to a spelling rule, and it is more reliable than English silent letters.","zh":"现在就去验证：凡是带着那三点的字 —— 河、海、汗、酒。四次四中。这是中文里最接近「拼写规则」的东西，而且比英语的不发音字母靠谱得多。","ja":"今すぐ試して：河、海、汗、酒。四つとも液体です。","es":"Compruébalo ahora: 河 río, 海 mar, 汗 sudor, 酒 alcohol. Cuatro de cuatro."}},"火山":{"k":"ci","s":{"en":"Fire mountain. English borrowed Vulcan, a Roman god — you need mythology to see it.","zh":"火的山。英文 volcano 来自罗马火神 Vulcan，你得先懂神话。","ja":"火の山。","es":"Montaña de fuego."},"x":{"en":"Japanese uses the exact same two characters — 火山, kazan — and Korean 화산 is the same word said aloud: half of Asia agreed this was the obvious name. English needed a Roman god (Vulcan) to say it. Bonus reading: 富士山 is a 山 — and yes, it is also a 火山.","zh":"日语用一模一样的两个字（火山，kazan），韩语的화산也是同一个词的读音——半个亚洲都认为这是显而易见的命名。英语得先请出罗马火神 Vulcan。顺手读个真东西：富士山是一座山，而且确实是一座火山。","ja":"日本語もそのまま「火山」、韓国語の화산も同じ語です。英語だけがローマ神話（Vulcan）を必要としました。","es":"El japonés usa los mismos caracteres (火山, kazan) y el coreano 화산 es la misma palabra. Medio Asia coincidió. El inglés necesitó un dios romano: Vulcano."}},"山水":{"k":"ci","s":{"en":"Mountain water. Also the name of an entire painting tradition.","zh":"山，和水。也是一整个画种的名字。","ja":"山と水。","es":"Montaña y agua."},"x":{"en":"Mountains-and-waters is how Chinese says landscape — and the name of a thousand-year painting tradition. Guidebooks still quote 桂林山水甲天下: 'Guilin's shanshui is first under heaven.' English landscape started as Dutch painters' jargon; Chinese just names what your eyes get: mountains, water.","zh":"中文管风景叫「山水」，一整个绵延千年的画种也叫这个名字。旅游手册至今还在引「桂林山水甲天下」。英语的 landscape 起初是荷兰画家的行话；中文直接说眼睛看到的东西：山，和水。","ja":"中国語で風景は「山水」。千年続く絵画の伝統の名前でもあります。「桂林山水甲天下」という決まり文句は今も現役です。","es":"Montañas-y-aguas es paisaje en chino, y el nombre de mil años de pintura. Las guías aún citan 桂林山水甲天下: 'el shanshui de Guilin es el primero bajo el cielo'."}},"森林":{"k":"ci","s":{"en":"The two characters you solved earlier now make a word.","zh":"你前面解开的两个字，现在拼成一个词。","ja":"先ほどの二字が単語になります。","es":"Los dos caracteres que resolviste forman una palabra."},"x":{"en":"You have probably met this word as a meme — the image that says Chinese is just logic: 木 tree, 林 woods, 森 forest. It goes viral every few months, and for once the internet is right. Chinese even has a proverb ready: 独木不成林 — one tree does not make a forest. English says no man is an island; Chinese says no tree is a forest.","zh":"你八成在梗图里见过它——那张「中文就是逻辑」的图：木、林、森。每隔几个月火一次，而且这次网上说的居然是真的。中文还有句现成的谚语：独木不成林。英语说 no man is an island，中文说：一棵树成不了林。","ja":"「木→林→森」のミーム画像を見たことがあるはずです。数ヶ月おきにバズりますが、珍しく本当です。「独木不成林」ということわざもあります。","es":"Seguro viste el meme: 木 árbol, 林 bosque, 森 selva. Se hace viral cada pocos meses, y por una vez internet tiene razón. Hay proverbio: 独木不成林, un árbol no hace bosque."}},"明月":{"k":"ci","s":{"en":"Two of the most common characters in Chinese poetry.","zh":"中文诗里出现最多的两个字之一。","ja":"漢詩に最も多く現れる語。","es":"De los más frecuentes en la poesía china."},"x":{"en":"The most famous poem in the Chinese language opens with this word: 床前明月光 — 'moonlight before my bed'. Li Bai, eighth century, twenty characters — and you have already built two of them (明 and 月). In Chinese poetry the bright moon means one thing: someone far from home, looking up.","zh":"中文里最有名的一首诗就以它开头：床前明月光。李白，八世纪，全诗二十个字——其中两个你已经亲手拼出来了（明和月）。在中国诗里，明月只有一个意思：离家的人，抬起了头。","ja":"中国語で最も有名な詩はこの語で始まります：「床前明月光」。李白、八世紀。明月の意味はひとつ——故郷を離れた人が空を見上げること。","es":"El poema más famoso del chino empieza con esta palabra: 床前明月光, 'luz de luna ante mi cama'. Li Bai, siglo VIII. En la poesía china la luna clara significa una cosa: alguien lejos de casa, mirando arriba."}},"明日":{"k":"ci","s":{"en":"Bright day. The written way to say tomorrow.","zh":"明，和日。书面一点的「明天」。","ja":"日本語と同じ書き方。","es":"Día brillante."},"x":{"en":"There is a whole Ming-dynasty poem about procrastination built on this word: 明日复明日，明日何其多 — 'tomorrow after tomorrow, how many tomorrows are there?' Four centuries before productivity YouTube, same message. Use it tonight: 明日见 — see you tomorrow.","zh":"有一整首明代的诗在用这个词讲拖延症：「明日复明日，明日何其多」。比效率类视频早了四百年，讲的是同一件事。今晚就能用：明日见。","ja":"明代の詩「明日复明日，明日何其多」は先延ばしについての詩です。生産性系動画より四百年早い。今夜使えます：明日見（また明日）。","es":"Hay un poema Ming entero sobre procrastinar con esta palabra: 明日复明日, 'mañana tras mañana, ¿cuántos mañanas hay?'. Cuatro siglos antes de YouTube. Úsala hoy: 明日见, hasta mañana."}},"尘土":{"k":"ci","s":{"en":"Dust and earth.","zh":"尘，和土。","ja":"ちりと土。","es":"Polvo y tierra."},"x":{"en":"English buries its dead with 'ashes to ashes, dust to dust' — and Chinese borrowed the line back as 尘归尘，土归土, dust to dust, earth to earth. You will hear it in Chinese films. Both nouns in that liturgy are the two you just picked. Some words do the heaviest lifting a language has.","zh":"英语葬礼说 ashes to ashes, dust to dust——中文把这句借了回来：「尘归尘，土归土」，影视剧里常听到。这句仪文里的两个名词，就是你刚选的两块。有些词，干的是一门语言里最重的活。","ja":"英語の「ashes to ashes, dust to dust」を中国語は「尘归尘，土归土」として借りました。映画でよく聞くフレーズです。","es":"El inglés entierra con 'polvo al polvo' — y el chino tomó prestada la frase: 尘归尘，土归土. La oirás en el cine chino. Los dos sustantivos son los que acabas de elegir."}},"休":{"k":"hui","s":{"en":"A person leaning against a tree.","zh":"一个人靠在一棵树上。","ja":"人が木にもたれている。","es":"Una persona apoyada en un árbol."},"x":{"en":"Now look at the left half of the modern character: that vertical stroke with the little flick is still the person. Three thousand years, one nap, never got up. English rest comes from an Old English word for a bed — true, but you cannot see a bed in r-e-s-t.","zh":"现在看现代字的左半边：那一竖加一撇，还是那个人。三千年一觉，他一直没起来。英语 rest 来自古英语的「床」—— 是真的，但你在 r-e-s-t 里看不到任何一张床。","ja":"現代字の左半分、あの縦棒がまだ「人」です。三千年起きていません。","es":"Mira la mitad izquierda del carácter moderno: ese trazo sigue siendo la persona."}},"从":{"k":"hui","s":{"en":"One person walking behind another.","zh":"一个人走在另一个人后面。","ja":"人が人の後ろを歩く。","es":"Una persona detrás de otra."},"x":{"en":"Add a third and you get 众, a crowd. So Chinese counts people the way it counts trees: one, two, many. English switches words every time — person, pair, crowd — and hides the pattern.","zh":"再加一个就是「众」。中文数人和数树是同一套办法：一个、两个、一堆。英语每次都换一个词 —— person、pair、crowd —— 把规律藏了起来。","ja":"もう一人加えると「众」（群衜）。木と同じ数え方です。","es":"Añade uno más y tienes 众, multitud. El chino cuenta personas como cuenta árboles."}},"好":{"k":"hui","s":{"en":"A woman and a child.","zh":"一个女人，一个孩子。","ja":"女と子。","es":"Una mujer y un niño."},"x":{"en":"The pretty reading is a mother holding her child. Scholars do not actually agree. We are telling you because a lot of apps sell you the pretty version as fact — and the truth is that some characters are three thousand years old and nobody was taking notes.","zh":"好听的那个解释是「母亲抱着孩子」。学界并没有定论。我们特意说明，是因为很多产品会把好听的那个当成事实卖给你 —— 而事实是，有些字已经三千岁了，当时没人做笔记。","ja":"通説は「母が子を抱く」ですが、定説はありません。","es":"La lectura bonita es una madre con su hijo. No hay consenso. Algunos caracteres tienen tres mil años y nadie tomaba notas."}},"看":{"k":"hui","s":{"en":"A hand above an eye — the gesture you make to see into the distance.","zh":"手搭在眼睛上方 —— 遮着阳光往远处望的那个动作。","ja":"手を目の上に。遠くを見る仕草です。","es":"Una mano sobre el ojo, el gesto de mirar lejos."},"x":{"en":"Look at the oracle-bone 目 above: it is lying down, shaped like an actual eye. Every 目 used to be horizontal. When Chinese started being written in vertical columns, the eye was tipped on its end to fit — and it never lay back down.","zh":"看上面那个甲骨文的「目」：它是横着的，像一只真的眼睛。所有的「目」本来都是横的 —— 后来中文改成竖着写，眼睛为了塞进竖行被立了起来，从此再没躺回去。","ja":"上の甲骨文の「目」は横向き、本物の目の形です。縦書きに合わせて立てられました。","es":"Mira el 目 oracular: está tumbado, como un ojo real. Se puso de pie para caber en la columna vertical."}},"问":{"k":"xing","s":{"en":"Careful — 门 here is not a door. It is the sound. mén gives you wèn; only 口 mouth carries the meaning.","zh":"注意 —— 这里的「门」不表示门，表示读音。mén 给出 wèn；只有「口」管意思。","ja":"注意：ここの「门」は意味ではなく音（mén → wèn）です。","es":"Ojo: 门 no es puerta, es el sonido. Solo 口 aporta significado."},"x":{"en":"About 80% of Chinese characters work like this: half for meaning, half for sound. English does it too — the ph in phone tells you nothing about telephones, it just says \"this word came from Greek, pronounce it /f/\". Anyone who tells you every character is a little picture is selling you something.","zh":"大约 80% 的汉字都是这么造的：一半管意思，一半管声音。英语也干同样的事 —— phone 里的 ph 完全不告诉你电话是什么，它只是在说「这个词来自希腊语，读 /f/」。谁要是告诉你每个汉字都是一幅画，那是在卖东西给你。","ja":"漢字の約80%がこの方式です。英語の phone の ph も同じで、意味ではなく音の印です。","es":"Cerca del 80% funciona así. El inglés hace igual: el ph de phone solo dice \"vino del griego, suénalo /f/\"."}},"闻":{"k":"xing","s":{"en":"Same trick as 问. 耳 ear carries the meaning; 门 only supplies the sound, mén → wén.","zh":"和「问」一个套路。「耳」管意思，「门」只提供读音 mén → wén。","ja":"「问」と同じ仕組みです。","es":"El mismo truco que 问."},"x":{"en":"This character drifted. It used to mean hear, and still does inside 新闻, news — literally new-things-heard. On its own it now usually means to smell. English did the same to smart: it meant painful for centuries before it meant clever.","zh":"这个字的意思漂移过：本义是「听」，「新闻」里还是这个意思 —— 字面就是「新听到的事」。但单用的时候，现代汉语里通常是「嗅」。英语的 smart 也一样 —— 它先当了好几个世纪的「疼」，才变成「聪明」。","ja":"意味が移りました。本義は「聞く」で「新闻」に残り、単独では今は「嗅ぐ」です。","es":"Antes significaba oír, y sigue así en 新闻 (noticias). Solo, hoy suele ser oler."}},"闯":{"k":"hui","s":{"en":"A horse coming out through a gate. This one really is a picture.","zh":"一匹马从门里冲出来。这个字是真的画面。","ja":"門から馬が飛び出す。これは本当に絵です。","es":"Un caballo saliendo por la puerta. Este sí es un dibujo."},"x":{"en":"Three characters, same 门: in 问 and 闻 it is only a sound, in 闯 it is the meaning. That is the whole difficulty of Chinese in one gate — you cannot tell which job a part is doing until you know the word. The oldest dictionary, from the year 121, defines 闯 in five words: \"the look of a horse leaving a gate\".","zh":"三个字都带「门」：问、闻 里它只是个声音，闯 里它是意思。中文的全部难处就在这扇门里 —— 在你认识这个词之前，你看不出部件在干哪份工。公元 121 年的《说文解字》给「闯」的解释只有四个字：「马出门貌」。","ja":"同じ「门」でも、问・闻 は音、闯 は意味。121年の辞書は「馬出門貌」と定義します。","es":"Tres caracteres, el mismo 门: en 问 y 闻 es sonido; en 闯, significado. El diccionario del año 121 lo define en cinco palabras."}},"忙":{"k":"xing","s":{"en":"Heart on the left, 亡 on the right. You have probably seen what people say this means.","zh":"左边是心，右边是「亡」。你大概见过网上怎么解释这个字。","ja":"左が心、右が「亡」。ネットでの説明を見たことがあるかもしれません。","es":"Corazón a la izquierda, 亡 a la derecha. Seguro has visto lo que dicen que significa."},"x":{"en":"The internet will tell you busy is heart 忄 plus death 亡 — so busy your heart is dying. It is everywhere, and it is not true. 亡 is here for the sound: wáng gives you máng. It carries no meaning at all. The same goes for the famous one about crisis meaning danger plus opportunity — a sinologist at Penn has spent years trying to kill that one. Chinese is full of real poetry. It does not need the invented kind.","zh":"网上会告诉你：忙 = 心 + 亡，忙到心都死了。这条到处都是，而且是编的。「亡」在这里只提供读音，wáng → máng，不带任何意思。同样有名的还有「危机 = 危险 + 机会」，宾大的汉学家为了辟这个谣写了很多年。中文里真的诗意已经够多了，不需要编的那种。","ja":"ネットでは「忙＝心＋亡、心が死ぬほど忙しい」と説明されます。よく見かけますが、事実ではありません。「亡」は音（wáng→máng）のためだけにあります。「危机＝危険＋機会」も同様に有名な誤りです。","es":"Internet te dirá que ocupado es corazón 忄 más muerte 亡. Está por todas partes y es falso: 亡 está por el sonido, wáng da máng. Lo mismo pasa con eso de que crisis es peligro más oportunidad."}},"人口":{"k":"ci","s":{"en":"The number of mouths to feed.","zh":"要养活的嘴的数量，就是人口。","ja":"養う口の数。","es":"Las bocas que alimentar."},"x":{"en":"A census in Chinese literally counts mouths. English quietly does the same: 'four mouths to feed', 'per capita' — Latin for by-the-head. Every language counts people in body parts; Chinese just left it visible in the word. Real usage: 中国人口 — the population of China, fourteen hundred million mouths.","zh":"中文的人口普查，字面上数的是「嘴」。英语其实也一样：four mouths to feed、per capita（拉丁语「按头算」）。所有语言都拿身体部位数人，中文只是把它留在了词面上。真实用法：中国人口，十四亿张嘴。","ja":"中国語の国勢調査は文字通り「口」を数えます。英語も per capita（頭あたり）と言います。どの言語も体の部位で人を数えるのです。","es":"El censo chino cuenta bocas, literalmente. El inglés hace igual sin decirlo: 'bocas que alimentar', 'per cápita' (por cabeza en latín). El chino solo lo dejó visible."}},"小心":{"k":"ci","s":{"en":"Small heart. Nothing in the English hints at either part.","zh":"小的心。英文 careful 里没有任何一个音节暗示「小」或「心」。","ja":"小さい心。","es":"Corazón pequeño."},"x":{"en":"If you ever laughed at a 'carefully slide' sign, this is the word behind it: 小心地滑 means 'careful — slippery floor', machine-translated into legend. You can now read the front half of the most memed sign in China. And yes: in Chinese, being careful is literally making your heart small.","zh":"如果你在外网笑过 carefully slide 的标牌，背后就是这个词：小心地滑，被机翻成了传世梗。现在，中国被玩梗最多的标牌，前一半你已经认识了。对——在中文里，谨慎就是把心变小。","ja":"海外で有名な誤訳看板 carefully slide の正体がこれ：「小心地滑」（足元注意）。最も有名なミーム看板の前半分が読めるようになりました。","es":"Si te reíste de un cartel 'carefully slide', esta es la palabra: 小心地滑 significa 'cuidado, suelo resbaladizo', traducido por máquina a la leyenda. Ya puedes leer la mitad del cartel más memeado de China."}},"泪水":{"k":"ci","s":{"en":"Tear water. Careful — the parts are not what you think.","zh":"泪，和水。注意别拼错了。","ja":"涙の水。","es":"Agua de lágrimas."},"x":{"en":"A trade secret: languages borrow feelings. English coined 'crocodile tears' six centuries ago; modern Chinese imported the whole idiom — 鳄鱼的眼泪, the crocodile's tears. The character you built is sitting inside it. Words cross borders faster than people do.","zh":"一个行业机密：语言会互相借情绪。英语六百年前发明了 crocodile tears，现代中文把整个习语搬了过来——鳄鱼的眼泪。你刚拼的那个「泪」就在里面。词过境，比人快。","ja":"言語は感情を借用します。英語の crocodile tears を中国語は「鳄鱼的眼泪」として丸ごと輸入しました。あなたが作った「泪」がその中にいます。","es":"Secreto del oficio: las lenguas se prestan sentimientos. El inglés acuñó 'lágrimas de cocodrilo'; el chino moderno importó el modismo entero: 鳄鱼的眼泪. Tu carácter está dentro."}},"明白":{"k":"ci","s":{"en":"Bright plus white. The character you built in chapter one, used again.","zh":"明 加 白。你第一章造的那个字，又用上了。","ja":"明＋白。第1章で作った字がまた出てきます。","es":"Brillante más blanco. El carácter que construiste en el capítulo uno."},"x":{"en":"Understanding, in Chinese, is a lighting condition. And English does exactly the same thing without noticing: I see. It is clear to me. That sheds light on it. Now it dawns on me. Four idioms, all about light, none of them literal. Two languages that never met agreed that knowing is brightness.","zh":"在中文里，「懂了」是一种光照条件。而英语干着一模一样的事却毫无自觉：I see、it is clear、that sheds light on it、now it dawns on me —— 四个习语全是光，没有一个是字面意思。两门从未谋面的语言，都认定「知道」就是「亮」。","ja":"中国語では「わかる」は明るさの状態です。英語も同じで、I see、it is clear、it dawns on me はすべて光の比喩です。出会ったことのない二つの言語が、同じ結論に達しました。","es":"Entender, en chino, es una condición de luz. Y el inglés hace lo mismo sin darse cuenta: I see, it is clear, it dawns on me. Dos lenguas que nunca se encontraron decidieron que saber es luz."}},"出口":{"k":"ci","s":{"en":"Go out, plus mouth. A mouth is any opening, not just the one on your face.","zh":"出，加口。「口」是任何一个开口，不只是脸上那个。","ja":"出＋口。「口」は顔の口だけでなく、あらゆる開口部です。","es":"Salir más boca. Una boca es cualquier abertura, no solo la de tu cara."},"x":{"en":"This is the first word you will actually read in the wild. It is above every exit in every station in China, in white on green, exactly where the English sign would be. Flip it to 入口 and you have the entrance. Two characters, and you can now navigate a subway.","zh":"这会是你在真实世界里读到的第一个词。中国每个车站的每个出口上方都写着它，绿底白字，位置和英文标识一模一样。把它翻过来变成「入口」，就是进站口。两个字，你已经能在地铁里认路了。","ja":"実際に街で最初に読める語です。中国のあらゆる駅の出口に、緑地に白でこう書いてあります。「入口」にすれば入り口。二字で地下鉄を歩けます。","es":"Es la primera palabra que leerás en el mundo real. Está sobre cada salida de cada estación en China, blanco sobre verde. Dale la vuelta y tienes 入口, la entrada."}},"东西":{"k":"ci","s":{"en":"East plus west. That is the ordinary Chinese word for a thing.","zh":"东 加 西。这就是中文里最普通的那个「东西」。","ja":"東＋西。これが中国語で「もの」を指す日常語です。","es":"Este más oeste. Esa es la palabra china corriente para una cosa."},"x":{"en":"Nobody is certain why. The best-known story says old markets ran east and west, so what you bought was east-west. Historians are not convinced. What is certain is that a billion people say it every day without ever thinking about it — the way English speakers say goodbye without hearing God be with you inside it. Every language is full of fossils its own speakers walk past.","zh":"没人完全确定为什么。流传最广的说法是古时集市分东市西市，买回来的就叫「东西」。史学界并不买账。确定的是：十几亿人每天说这个词，从来没想过它是什么意思 —— 就像英语母语者说 goodbye 时，听不见里面藏着的 God be with you。每种语言都有自己人天天路过却看不见的化石。","ja":"理由は誰にも断定できません。有名な説では、昔の市が東西に分かれていたからだと言います。確かなのは、十数億人が毎日この語を使い、一度も考えたことがないという事実です。英語話者が goodbye の中の God be with you を聞かないのと同じです。","es":"Nadie sabe con certeza. La historia más conocida dice que los mercados antiguos iban de este a oeste. Lo cierto es que mil millones de personas lo dicen a diario sin pensarlo, igual que los angloparlantes dicen goodbye sin oír God be with you."}},"银河":{"k":"ci","s":{"en":"Silver river. English sees milk; Chinese sees silver. Same band of stars, two different minds.","zh":"银 ＋ 河。英文管它叫「牛奶路」，中文看见的是银子。同一条东西，两边想的完全不一样。","ja":"銀の川。英語は「ミルク」、日本語は「天の川」。","es":"Río de plata. El inglés ve leche; el chino ve plata."},"x":{"en":"Li Bai used this word for a waterfall: 疑是银河落九天 — 'as if the Silver River fell from the ninth heaven'. And every summer, Qixi (the 'Chinese Valentine's Day' trending on your feed) retells the legend of two lovers separated by this river, reunited once a year on a bridge of magpies. English got milk. Chinese got a love story.","zh":"李白拿这个词写瀑布：「疑是银河落九天」。每年夏天，你时间线上的「中国情人节」七夕，讲的就是被这条河分开的两个人，一年一次靠喜鹊搭桥相见。英语分到了牛奶，中文分到了一个爱情故事。","ja":"李白は滝をこう詠みました：「疑是銀河落九天」。七夕伝説では、この川に隔てられた二人が年に一度だけ会えます。英語はミルク、中国語は恋物語。","es":"Li Bai la usó para una cascada: 疑是银河落九天, 'como si el Río de Plata cayera del noveno cielo'. Y cada verano, Qixi recuenta a dos amantes separados por este río. El inglés recibió leche; el chino, una historia de amor."}},"电影":{"k":"ci","s":{"en":"Electric shadow. English named the motion; Chinese named the shadow.","zh":"电 ＋ 影。英文 movie 的词根是「动」，中文选的是「影」。一百年前造的词，今天看还是准的。","ja":"電気の影。日本語は「映画」。","es":"Sombra eléctrica."},"x":{"en":"You may have seen the viral list — 'Chinese words that sound like cyberpunk': movie = electric shadow, computer = electric brain, train = fire car. This game is that list, playable. And the word is exact: a film really is shadows driven by electricity. 看电影 — 'watch a movie' — is on every first date in China.","zh":"你可能刷到过那张疯传清单——「听起来像赛博朋克的中文词」：电影 = electric shadow，电脑 = electric brain，火车 = fire car。这个游戏就是那张清单的可玩版。而且这个词造得极准：电影确实就是被电驱动的影子。造句：看电影——中国每一场初次约会的保留节目。","ja":"バズった例のリスト——「サイバーパンクに聞こえる中国語」：電影＝電気の影。しかも正確です。映画は本当に電気で動く影ですから。","es":"Habrás visto la lista viral: 'palabras chinas que suenan a cyberpunk': película = sombra eléctrica, ordenador = cerebro eléctrico. Este juego es esa lista, jugable. Y es exacta: el cine es sombra movida por electricidad. 看电影: ver una película."}},"火车":{"k":"ci","s":{"en":"Fire vehicle. More honest than English train, which just means to drag.","zh":"火 ＋ 车。英文 train 的意思其实是「拖拽」，中文选的是驱动它的东西。","ja":"火の車。","es":"Vehículo de fuego."},"x":{"en":"From the age when trains ran on actual fire. English train just means 'a thing dragged' — same root as trailer. The sequel word is better: today's bullet trains are 高铁, 'tall iron', and China runs more of them than the rest of the planet combined. Fire car, then tall iron. The story continues.","zh":"来自火车真的烧火的年代。英语 train 的本义只是「被拖着走的东西」——和 trailer 同根。续集词更好：今天的高速列车叫高铁，而中国的高铁里程比全世界其他地方加起来还多。先是火车，然后是高铁。故事还在写。","ja":"汽車が本当に火で走った時代の言葉。英語の train は「引かれるもの」という意味だけ。続編の語「高鉄」（高速鉄道）は今、中国が世界一です。","es":"De cuando los trenes corrían con fuego real. Train en inglés solo significa 'cosa arrastrada'. La secuela es mejor: los trenes bala son 高铁, 'hierro alto', y China tiene más que el resto del planeta junto."}},"河马":{"k":"ci","s":{"en":"River horse. Hippopotamus is Greek for river horse too — Chinese just does not make you learn Greek first.","zh":"河 ＋ 马。有意思的是 hippopotamus 在希腊语里也是「河马」，只是你得先会希腊语才看得见。","ja":"川の馬。","es":"Caballo de río."},"x":{"en":"Now open up the Greek: hippo-potamus is horse-of-the-river, the very same word. Two civilisations, five thousand kilometres apart, looked at the same absurd animal and wrote the same name — one buried it in Greek, one left it readable. You already own both halves.","zh":"把希腊语拆开看：hippo（马）-potamus（河）——一模一样的词。相隔五千公里的两个文明，看着同一只荒谬的动物，写下了同一个名字——一边把它埋进希腊语，一边留在明面上。这两半你都已经集齐了。","ja":"ギリシャ語を開くと hippo-potamus は「川の馬」。五千キロ離れた二つの文明が同じ名前を書きました。片方は読める形で。","es":"Abre el griego: hipo-pótamo es caballo-de-río, la misma palabra exacta. Dos civilizaciones a cinco mil kilómetros escribieron el mismo nombre; una lo enterró en griego, la otra lo dejó legible."}},"松鼠":{"k":"ci","s":{"en":"Pine mouse. Chinese named where it lives; English borrowed Greek for shadow-tail.","zh":"松 ＋ 鼠。中文按它住哪儿命名；英文 squirrel 来自希腊语「影子尾巴」。","ja":"松のねずみ。","es":"Ratón de pino."},"x":{"en":"There is a running joke that Chinese animal names were invented by someone describing animals over a bad phone line: pine mouse, pocket mouse, river horse, bear cat. All real — all in this chapter. English squirrel is Greek for 'shadow-tail'. Prettier, but you needed Greek to see it.","zh":"网上有个长盛不衰的段子：中文动物名像是有人隔着劣质电话线描述动物——pine mouse、pocket mouse、river horse、bear cat。全是真的，而且全在这一章。英语 squirrel 是希腊语「影子尾巴」——更美，但你得先学希腊语才看得见。","ja":"「中国語の動物名は電話越しの説明みたいだ」というジョークがあります：松のねずみ、袋のねずみ、川の馬、熊の猫。全部本物で、全部この章にいます。","es":"Hay un chiste recurrente: los nombres chinos de animales parecen descripciones por teléfono con mala señal: ratón de pino, ratón de bolsa, caballo de río, oso gato. Todos reales, todos en este capítulo."}},"袋鼠":{"k":"ci","s":{"en":"Pocket mouse. Once you have 鼠, half the animal kingdom opens up.","zh":"袋 ＋ 鼠。有了「鼠」这块，半个动物园都能拼出来。","ja":"袋のねずみ。","es":"Ratón de bolsa."},"x":{"en":"English tells a famous story about kangaroo — that it meant 'I don't understand you' in an Aboriginal language. Sadly for the story, it's debunked: gangurru really was the animal's name. Every language has its viral fake etymology (remember 忙?). Chinese ducked the whole problem: it saw the pocket, it wrote the pocket.","zh":"英语关于 kangaroo 有个著名传说——说它在土著语里的意思是「我听不懂」。可惜传说被辟谣了：gangurru 就是那种动物的名字。每种语言都有自己的疯传伪词源（还记得「忙」吗？）。中文直接绕开了整个问题：看见口袋，写下口袋。","ja":"kangaroo は「わからない」という意味だった——という有名な話は俗説です。どの言語にもバズる偽語源があります（「忙」を覚えていますか）。中国語は問題ごと回避：袋を見て、袋と書いた。","es":"El inglés cuenta que kangaroo significaba 'no te entiendo' en lengua aborigen. Desmentido: gangurru era el nombre real del animal. Toda lengua tiene su falsa etimología viral (¿recuerdas 忙?). El chino esquivó el problema: vio la bolsa, escribió la bolsa."}},"海豚":{"k":"ci","s":{"en":"Sea pig. Not a fish, and Chinese says so. Careful: sea + fish is also a real word.","zh":"海 ＋ 豚。中文认得清它不是鱼。注意：海 + 鱼 也是真词（海鱼）。","ja":"海の豚。","es":"Cerdo de mar."},"x":{"en":"Sea pig sounds rude — until you check the receipts. English porpoise is Latin porcus + piscis, 'pig-fish'. German calls the guinea pig a little sea-pig (Meerschweinchen). Half of Europe agreed with China: round, smooth, snouted — pig. Dolphins deserved better from all of us.","zh":"「海里的猪」听着不体面——直到你翻旧账：英语 porpoise 来自拉丁语 porcus + piscis，「猪鱼」；德语管豚鼠叫「小海猪」（Meerschweinchen）。半个欧洲和中国想到了一块儿：圆的、滑的、带吻突的——猪。海豚值得我们所有人给它起个更好的名字。","ja":"「海の豚」は失礼に聞こえますが、英語の porpoise もラテン語で「豚魚」、ドイツ語のモルモットは「小さな海豚」です。ヨーロッパの半分が中国と同意見でした。","es":"Cerdo de mar suena feo — hasta revisar los recibos: porpoise viene del latín porcus + piscis, 'pez-cerdo', y el alemán llama al cuy 'cerdito de mar'. Media Europa coincidió con China."}},"熊猫":{"k":"ci","s":{"en":"Bear cat. English took the word from Nepali; Chinese just described it.","zh":"熊 ＋ 猫。英文 panda 借自尼泊尔语，是个音；中文直接说它长什么样。","ja":"熊の猫。","es":"Oso gato."},"x":{"en":"The one animal name China exported to the whole planet: panda diplomacy, Kung Fu Panda (功夫熊猫), and the eternal debate over whether it should really be 猫熊, cat-bear (Taiwan says yes). English panda was borrowed from Nepali and nobody is quite sure what it meant. 熊猫 you can read on sight — you just did.","zh":"中国出口给全世界的那个动物名：熊猫外交、功夫熊猫，还有永恒的争论——到底该叫熊猫还是猫熊（台湾坚持后者）。英语 panda 借自尼泊尔语，本义至今没人说得清。而熊猫两个字，你看一眼就读出来了——刚刚就读了。","ja":"中国が世界に輸出した動物名。パンダ外交、カンフーパンダ、そして「猫熊」か「熊猫」かという永遠の論争。英語の panda はネパール語からの借用で、本義は不明のままです。","es":"El nombre animal que China exportó al planeta: diplomacia panda, Kung Fu Panda (功夫熊猫), y el eterno debate de si debería ser 猫熊, gato-oso (Taiwán dice que sí). Panda en inglés viene del nepalí y nadie sabe bien qué significaba."}},"火鸡":{"k":"ci","s":{"en":"Fire chicken, for the red wattle. English named it after a country it never came from.","zh":"火 ＋ 鸡 —— 说的是它脖子上那团红。英文 turkey 是拿一个跟它毫无关系的国家命名的。","ja":"火の鶏。","es":"Pollo de fuego."},"x":{"en":"Meet the world's most confused bird. English named it after Turkey; Turkish calls it hindi (India); Hindi calls it Peru; Portuguese agrees. There's a viral map of every country blaming another country. China skipped the geography fight and looked at the actual bird: red wattle. Fire chicken. Done.","zh":"认识一下全世界最迷惑的鸟。英语拿土耳其给它命名；土耳其语叫它 hindi（印度）；印地语叫它秘鲁；葡萄牙语表示同意。有一张疯传的地图：每个国家都把锅甩给另一个国家。中国没参加这场地理大战，只是看了看鸟本身：脖子上一团红。火鸡。收工。","ja":"世界一混乱した鳥。英語はトルコ、トルコ語はインド、ヒンディー語はペルーと呼ぶ。各国が責任を押し付け合う地図がバズりました。中国は地理戦争に参加せず、鳥を見た：首が赤い。火の鶏。以上。","es":"El ave más confundida del mundo: el inglés la nombró por Turquía; el turco la llama hindi (India); el hindi, Perú. Hay un mapa viral de países culpándose. China miró al ave: cuello rojo. Pollo de fuego. Listo."}},"眼镜":{"k":"ci","s":{"en":"Eye mirror. Note 眼 and 目 both mean eye — 目 is the ancient one, 眼 is the one you use.","zh":"眼 ＋ 镜。注意 眼 和 目 都是眼睛：目 是古的那个，眼 是你日常用的那个。","ja":"目の鏡。","es":"Espejo de ojo."},"x":{"en":"Keep this word — it unlocks a chain. 眼镜蛇, 'glasses-snake', is the cobra, named for the spectacle pattern on its hood. English herpetologists say spectacled cobra — the exact same idea. One word in, and you can already read a snake.","zh":"记住这个词——它能解锁一条链。眼镜蛇，「戴眼镜的蛇」，因为颈部有一副眼镜形的斑。英语爬行学家也管它叫 spectacled cobra，一模一样的思路。才学一个词，你已经顺手认识了一条蛇。","ja":"この語は連鎖します。「眼镜蛇」（メガネのヘビ）はコブラのこと。英語でも spectacled cobra と言います。単語ひとつで、ヘビが一匹読めるようになりました。","es":"Guarda esta palabra: desbloquea una cadena. 眼镜蛇, 'serpiente con gafas', es la cobra, por el dibujo de anteojos en su capucha. Los herpetólogos ingleses dicen spectacled cobra: la misma idea."}},"地铁":{"k":"ci","s":{"en":"Ground iron. English named the tunnel; Chinese named the rails. Three traps here are real words.","zh":"地 ＋ 铁。英文说的是「地下的路」，中文说的是「地下的铁」。这题三个陷阱都是真词。","ja":"地の鉄。","es":"Hierro de tierra."},"x":{"en":"London named the tunnel (underground). New York named the depth (subway). Paris abbreviated a bureaucracy (métro, from 'metropolitan railway'). Chinese named the thing itself: iron under the ground. Next time you see 地铁站 on a sign you'll read all three characters — 站 is station.","zh":"伦敦命名了隧道（underground），纽约命名了深度（subway），巴黎缩写了一个机构名（métro，来自「大都会铁路」）。中文命名了东西本身：地下的铁。下次在标牌上看到「地铁站」，三个字你全认识——「站」就是 station。","ja":"ロンドンはトンネルを、ニューヨークは深さを、パリは役所名の略を選びました。中国語はモノ自体を命名：地下の鉄。「地铁站」の「站」は駅です。","es":"Londres nombró el túnel (underground), Nueva York la profundidad (subway), París abrevió una burocracia (métro). El chino nombró la cosa: hierro bajo tierra. En el cartel 地铁站, 站 es estación."}},"电脑":{"k":"ci","s":{"en":"Electric brain. English named the job; Chinese named the organ it replaces.","zh":"电 ＋ 脑。英文 computer 说的是「计算的东西」，中文说的是「电做的脑子」。","ja":"電気の脳。","es":"Cerebro eléctrico."},"x":{"en":"The finale of the cyberpunk list: electric brain. English computer describes the job (it computes); Chinese describes the organ it replaced. That's why Chinese tech slang feels alive — a crashed computer is 死机, 'the machine died'. A billion people type this word every day, and you now know both halves.","zh":"赛博朋克清单的压轴：电的脑。英语 computer 描述职能（它计算），中文描述它替代的器官。所以中文科技俚语才那么生动——电脑崩了叫「死机」，机器死了。十几亿人每天都在敲这个词，现在它的两半你都认识。","ja":"サイバーパンクリストの大トリ：電気の脳。英語は職能を、中国語は置き換えた器官を描写します。クラッシュは「死機」——機械が死んだ、です。","es":"El final de la lista cyberpunk: cerebro eléctrico. Computer describe el trabajo; el chino, el órgano que reemplazó. Por eso la jerga china está viva: un ordenador colgado es 死机, 'la máquina murió'."}},"冰箱":{"k":"ci","s":{"en":"Ice box. English called it that too, a century ago, then changed its mind.","zh":"冰 ＋ 箱。英文一百年前也叫它 icebox，后来改口了，中文没改。","ja":"氷の箱。","es":"Caja de hielo."},"x":{"en":"English used to say exactly this — icebox, a wooden cabinet with a block of ice — then the technology changed and English rebranded. Chinese kept the old name and let the meaning upgrade itself. Half of Chinese tech vocabulary works like this: new machine, old picture. Fridge magnet? 冰箱贴 — 'icebox sticker'.","zh":"英语原来也是这么叫的——icebox，放冰块的木柜——后来技术变了，英语改了口。中文留着旧名字，让意思自己升级。一大半中文科技词都是这个路数：新机器，旧图画。冰箱贴？字面就是「贴在冰箱上的东西」。","ja":"英語も昔は icebox（氷の箱）と言っていました。技術が変わると英語は改名し、中国語は古い名前のまま意味を更新しました。","es":"El inglés decía exactamente esto: icebox, caja de hielo. Cambió la tecnología y el inglés cambió de marca. El chino conservó el nombre viejo y dejó que el significado se actualizara solo."}},"口红":{"k":"ci","s":{"en":"Mouth red. English named the object; Chinese named the result.","zh":"口 ＋ 红。英文说的是那根「棒」，中文说的是抹上去之后的「红」。","ja":"口の赤。","es":"Rojo de boca."},"x":{"en":"English named the object — a stick for lips. Chinese named the result: mouth, red. If Chinese internet culture ever crossed your feed, you've met this word: the 'Lipstick King' (口红一哥) Austin Li once sold 15,000 lipsticks in five minutes on livestream — global headlines, this exact word in them.","zh":"英语命名物件——涂唇的棒（lip-stick）。中文命名结果：口，红。如果中国互联网文化从你时间线上路过过，你已经见过这个词：「口红一哥」李佳琦，直播五分钟卖掉一万五千支口红——上了全球新闻，标题里就是这两个字。","ja":"英語はモノ（唇の棒）を、中国語は結果（口が赤い）を命名しました。「口紅一哥」李佳琦がライブ配信5分で口紅1万5千本を売った話は世界ニュースになりました。","es":"El inglés nombró el objeto: un lápiz para labios. El chino nombró el resultado: boca, rojo. El 'Rey del Pintalabios' (口红一哥) vendió 15.000 en cinco minutos por livestream: titulares globales con esta palabra exacta."}},"妈":{"k":"xing","s":{"en":"Woman for the meaning, horse for the sound: mǎ bends into mā. The horse says nothing about mothers.","zh":"女表意，马表音：mǎ 转个调就是 mā。马和妈妈没有任何关系。","ja":"女が意味、馬は音（mǎ→mā）。馬に母の意味はありません。","es":"Mujer da el sentido; caballo, solo el sonido: mǎ se dobla en mā."},"x":{"en":"Nearly every language on Earth says some version of mama — linguists say it's simply the first sound a baby can make. Chinese agreed and spelled it honestly: woman + the sound ma. If you ever see the joke that 'mom = woman + horse', you can now ruin it politely: the horse only came to say ma.","zh":"地球上几乎每种语言的「妈妈」都长得差不多——语言学家说，这是婴儿最容易发出的音。中文照实拼写：女＋一个 ma 音。下次刷到「妈=女人+马」的段子，你可以礼貌地拆台：那匹马只是来发音的。","ja":"世界中の言語で「ママ」は似ています。赤ちゃんが最初に出せる音だからです。中国語は「女＋音 ma」と正直に綴りました。馬はただ発音しに来ただけです。","es":"Casi toda lengua dice algo como mamá: es el primer sonido que puede hacer un bebé. El chino lo escribió honesto: mujer + el sonido ma. El caballo solo vino a pronunciar."}},"鸣":{"k":"hui","s":{"en":"A mouth and a bird. What a bird does with its mouth.","zh":"口和鸟。鸟用嘴做的那件事。","ja":"口と鳥。鳥が口ですることです。","es":"Una boca y un pájaro. Lo que hace un pájaro con la boca."},"x":{"en":"The idiom 一鸣惊人 — 'one cry astonishes the world' — is for quiet people who suddenly do something spectacular. It comes from a king who ignored his duties for three years, then said: this bird hasn't flown yet — when it flies it will pierce the sky; when it cries, it will astonish the world. Then he reformed overnight. A 2,300-year-old comeback story, and this character is its verb.","zh":"成语「一鸣惊人」，说的是平时不声不响、突然干出大事的人。典出一位三年不理朝政的君王：此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。随后一夜改过。两千三百年前的逆袭故事，动词就是这个字。","ja":"「一鳴驚人」——普段は静かな者が突然大事を成すこと。三年間政務を放った王の故事から。二千三百年前の逆転劇の動詞がこの字です。","es":"El modismo 一鸣惊人 — \"un canto asombra al mundo\" — es para gente callada que de pronto hace algo espectacular. Viene de un rey que ignoró sus deberes tres años. Una historia de remontada de hace 2.300 años."}},"吗":{"k":"xing","s":{"en":"Mouth for the meaning, 马 for the sound. Hang it on the end of any sentence and the sentence becomes a question.","zh":"口表意，马表音。挂在任何句子后面，句子就变成了问句。","ja":"口が意味、馬が音。文末に付けるだけで疑問文になります。","es":"Boca para el sentido, 马 para el sonido. Cuélgalo al final y la frase se vuelve pregunta."},"x":{"en":"English flips words around (Are you—?), summons do from nowhere (Do you like—?), and keeps seven question words on staff. Chinese asks with one syllable: statement + 吗. Done. 好吗 — OK? — might be the most efficient grammar on the planet. This is the point in the course where learners of Chinese exhale with relief.","zh":"英语问句要倒装（Are you—?），要凭空请出 do（Do you like—?）。中文问句只要一个音节：陈述句＋吗。搞定。「好吗」可能是地球上效率最高的语法。学中文的老外，学到这里通常会如释重负地呼一口气。","ja":"英語は語順を入れ替え、do まで呼び出します。中国語は文末に「吗」を付けるだけ。「好吗」は地球上で最も効率的な文法かもしれません。","es":"El inglés invierte el orden e invoca el do. El chino pregunta con una sílaba: frase + 吗. 好吗 — ¿vale? — quizá la gramática más eficiente del planeta."}},"灶":{"k":"hui","s":{"en":"Fire on earth — the earthen hearth every old kitchen was built around.","zh":"火加土——老厨房里那座土灶。","ja":"火と土。昔の台所の中心にあった竈です。","es":"Fuego sobre tierra: el fogón de barro de toda cocina antigua."},"x":{"en":"Every Chinese kitchen used to house an informant: the Kitchen God, who filed an annual report on the family to heaven. So families smeared his paper portrait's lips with sticky sugar — so he could only say sweet things. Bribery, as folk religion. The character got renovated too: the old form 竈 was so hard to write that reformers rebuilt it as fire + earth. Same stove, better floor plan.","zh":"中国厨房里曾住着一位报信人：灶神，每年上天汇报这家人的表现。所以人们给他画像的嘴上抹麦芽糖——让他只能说甜话。民俗版的行贿。这个字本身也翻修过：旧写法「竈」难到没人想写，后来直接重建成火＋土。同一座灶，户型好多了。","ja":"中国の台所には竈神が住み、年に一度天へ家族の報告をしました。人々は絵の口に飴を塗り、甘いことしか言えなくしました。旧字「竈」は難しすぎて「火＋土」に建て替えられました。","es":"Cada cocina china alojaba a un informante: el Dios del Fogón, que reportaba al cielo una vez al año. Le untaban azúcar en los labios del retrato para que solo dijera cosas dulces. El carácter también fue renovado: la forma antigua 竈 era tan difícil que la reconstruyeron como fuego + tierra."}},"闪":{"k":"hui","s":{"en":"A person slipping through a doorway — there and gone.","zh":"一个人从门里侧身而过——一晃就没了。","ja":"人が門をすり抜ける——一瞬で消えます。","es":"Una persona escurriéndose por la puerta: aparece y desaparece."},"x":{"en":"One picture, three meanings, all the same motion: dodge aside (闪开!), a flash of lightning (闪电 — the sky darting into view), even wrenching your back (闪腰 — a dodge gone wrong). Modern Chinese coined a fourth: 闪婚, flash marriage — wed at lightning speed. The person in that doorway has been busy for three thousand years.","zh":"一幅画，三个意思，同一个动作：闪开（躲避）、闪电（天空一晃）、闪了腰（一次失败的躲闪）。现代中文又造了第四个：闪婚——以闪电的速度结婚。门里那个人，三千年来一直没闲着。","ja":"一枚の絵に三つの意味：よける（闪开）、稲妻（闪电）、ぎっくり腰（闪腰）。現代語は四つ目を作りました：閃婚——電撃結婚。門の中の人は三千年間working。","es":"Una imagen, tres sentidos, el mismo movimiento: esquivar (闪开), relámpago (闪电), lumbago (闪腰 — un esquive fallido). El chino moderno acuñó el cuarto: 闪婚, boda relámpago."}},"闷":{"k":"xing","s":{"en":"A heart shut inside a door. And 门 lends the sound too: mén → mèn.","zh":"心被关在门里。门还同时表音：mén → mèn。","ja":"心が門の中に。門は音も担当します（mén→mèn）。","es":"Un corazón encerrado tras una puerta. Y 门 presta también el sonido."},"x":{"en":"A rare character where the sound part moonlights as meaning: 门 gives the pronunciation and really is the door. Scholars have a name for this double duty (xíngshēng jiān huìyì). You'll hear the word all summer (天气好闷 — the air is stuffy) and on rainy Sundays (好闷 — so bored). One character for a sealed room and a sealed mood — which is exactly how both of them feel.","zh":"一个少见的字：声旁兼职表意——门既给读音，又真的是那扇门。学界管这个叫「形声兼会意」。这个词你夏天会常听到（天气好闷），下雨的周日也会（好闷）。一个字同时管密闭的房间和密闭的心情——这两件事的体感，本来就是一回事。","ja":"珍しく音符が意味も兼ねる字：門は音でもあり、本当に扉でもあります。夏の蒸し暑さにも（天气好闷）、退屈な日曜にも（好闷）使います。密閉された部屋と心は、同じ感覚です。","es":"Raro carácter donde el fonético también aporta sentido: 门 da el sonido y de verdad es la puerta. Lo oirás todo el verano (aire cargado) y los domingos de lluvia (qué tedio). Un carácter para un cuarto sellado y un ánimo sellado."}}};/*</EX>*/

function dOf(p){return DIFF[p.w]||2;}
function nTiles(p){return dOf(p)===1?4:(dOf(p)===2?6:8);}
function chQ(c){return Q.filter(function(x){return x.c===c;}).slice().sort(function(a,b){return dOf(a)-dOf(b);});}

function known(){var o={};Q.forEach(function(x){if(solved[x.w])o[x.w]=1;});return o;}
function rnd(seed){var x=seed*9301%233280;return function(){x=(x*9301+49297)%233280;return x/233280;};}
function tilesFor(p,idx){
  var N=nTiles(p);
  if(p.t)return shuffle(p.t.slice(0,N),idx);
  var pool=CH[p.c].pool.concat(Object.keys(known())),out=[p.a];
  if(p.b!==p.a)out.push(p.b);
  var r=rnd(idx+7),cand=pool.filter(function(x){return out.indexOf(x)<0;});
  while(out.length<N&&cand.length){var j=Math.floor(r()*cand.length);out.push(cand.splice(j,1)[0]);}
  return shuffle(out,idx);}
function shuffle(arr,seed){var a=arr.slice(),r=rnd(seed+13);
  for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var m=a[i];a[i]=a[j];a[j]=m;}return a;}

function slots(){[0,1].forEach(function(i){var e=q('s'+i);e.innerHTML=sel[i]?face(sel[i]):'';

function check(){
  if(over||sel.length<2)return;
  var p=cur(),need=[p.a,p.b].slice(),hit=0;
  sel.forEach(function(c){var k=need.indexOf(c);if(k>-1){need.splice(k,1);hit++;}});
  var kls=hit===2?'g':(hit===1?'a':'n'),lab=hit===2?t.kg:(hit===1?t.kh:t.kn);
  tries.push(hit===2?'🟩':(hit===1?'🟨':'⬜'));

  r.innerHTML='<span class="gt '+kls+'">'+sel[0]+'</span><span class="gt '+kls+'">'+sel[1]+'</span><span class="rl '+kls+'">'+lab+'</span>';
  q('rows').appendChild(r);

  if(hit===2)finish(true);
  else if(tries.length>=6)finish(false);

    if(tries.length>=2&&shown<2)q('hintb').style.display='inline-block';

function finish(win){
  over=true;q('check').disabled=true;coach(2);
  var p=cur(),isNew=!solved[p.w];
  if(win){solved[p.w]=1;justSolved=isNew?p.w:null;

  var last=win&&chDone(ci);
