  :root{
    --bg:#E4EAEC; --paper:#F7F9F9; --sunk:#EDF1F2; --line:#DCE3E5; --line-2:#C6D0D3;
    --ink:#1B1F21; --ink-2:#5A646A; --ink-3:#939EA3;
    --seal:#C8452F; --jade:#2E7A6B; --jade-bg:#E2EEEB; --gamboge:#B07D1E; --stone:#B4BEC1;
    --f-han:"Hanzi Serif","Songti SC","Songti TC","STSong","SimSun","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK SC",serif;
    --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
    --s1:6px; --s2:10px; --s3:14px; --s4:20px; --s5:28px;
    --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-lg:16px; --t-xl:20px; --t-2xl:26px;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0E1113; --paper:#1A1E21; --sunk:#141719; --line:#2A3033; --line-2:#3A4245;
    --ink:#E8EDEE; --ink-2:#9AA5AA; --ink-3:#6B767B;
    --seal:#E0705C; --jade:#5FBEA8; --jade-bg:#182C29; --gamboge:#D9A64B; --stone:#5A6367;}}
  :root[data-theme="light"]{--bg:#E4EAEC;--paper:#F7F9F9;--sunk:#EDF1F2;--line:#DCE3E5;--line-2:#C6D0D3;--ink:#1B1F21;--ink-2:#5A646A;--ink-3:#939EA3;--seal:#C8452F;--jade:#2E7A6B;--jade-bg:#E2EEEB;--gamboge:#B07D1E;--stone:#B4BEC1}
  :root[data-theme="dark"]{--bg:#0E1113;--paper:#1A1E21;--sunk:#141719;--line:#2A3033;--line-2:#3A4245;--ink:#E8EDEE;--ink-2:#9AA5AA;--ink-3:#6B767B;--seal:#E0705C;--jade:#5FBEA8;--jade-bg:#182C29;--gamboge:#D9A64B;--stone:#5A6367}

  *{box-sizing:border-box;min-width:0}
  body{margin:0;background:var(--bg)}
  .app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);
    font-family:var(--f-ui);font-size:var(--t-md);line-height:1.6;color:var(--ink);display:flex;flex-direction:column}
  @media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
    padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
  .logo{display:flex;align-items:baseline;gap:8px}
  .logo b{font-family:var(--f-han);font-size:26px;font-weight:400;line-height:1;color:var(--seal)}

},{"a":"山","b":"水","w":"山水","py":"shānshuǐ","ic":"🏔️","c":1,"q":{"en":"landscape","es":"paisaje"},"s":{"en":"Mountain water. Also the name of an entire painting tradition.","zh":"山，和水。也是一整个画种的名字。","ja":"山と水。","es":"Montaña y agua."}},{"a":"森","b":"林","w":"森林","py":"sēnlín","ic":"🌲","c":1,"q":{"en":"forest (the word)","es":"bosque (palabra)"},"s":{"en":"The two characters you solved earlier now make a word.","zh":"你前面解开的两个字，现在拼成一个词。","ja":"先ほどの二字が単語になります。","es":"Los dos caracteres que resolviste forman una palabra."}},{"a":"明","b":"月","w":"明月","py":"míngyuè","ic":"🌕","c":1,"q":{"en":"a bright moon","es":"luna clara"},"s":{"en":"Two of the most common characters in Chinese poetry.","zh":"中文诗里出现最多的两个字之一。","ja":"漢詩に最も多く現れる語。","es":"De los más frecuentes en la poesía china."}},{"a":"明","b":"日","w":"明日","py":"míngrì","ic":"📅","c":1,"q":{"en":"tomorrow","es":"mañana"},"s":{"en":"Bright day. The written way to say tomorrow.","zh":"明，和日。书面一点的「明天」。","ja":"日本語と同じ書き方。","es":"Día brillante."}},{"a":"尘","b":"土","w":"尘土","py":"chéntǔ","ic":"🟫","c":1,"q":{"en":"dust (the word)","es":"polvo (palabra)"},"s":{"en":"Dust and earth.","zh":"尘，和土。","ja":"ちりと土。","es":"Polvo y tierra."}},{"a":"人","b":"木","w":"休","py":"xiū","ic":"😴","c":2,"q":{"en":"to rest","es":"descansar"},"s":{"en":"A person leaning against a tree.","zh":"一个人靠在一棵树上。","ja":"人が木にもたれている。","es":"Una persona apoyada en un árbol."}},{"a":"人","b":"人","w":"从","py":"cóng","ic":"👣","c":2,"q":{"en":"to follow","es":"seguir"},"s":{"en":"One person walking behind another.","zh":"一个人走在另一个人后面。","ja":"人が人の後ろを歩く。","es":"Una persona detrás de otra."}},{"a":"女","b":"子","w":"好","py":"hǎo","ic":"👍","c":2,"q":{"en":"good","es":"bueno"},"s":{"en":"A woman and a child.","zh":"一个女人，一个孩子。","ja":"女と子。","es":"Una mujer y un niño."}},{"a":"手","b":"目","w":"看","py":"kàn","ic":"👀","c":2,"q":{"en":"to look","es":"mirar"},"s":{"en":"A hand above an eye — the gesture you make to see into the distance.","zh":"手搭在眼睛上方 —— 遮着阳光往远处望的那个动作。","ja":"手を目の上に。遠くを見る仕草です。","es":"Una mano sobre el ojo, el gesto de mirar lejos."}},{"a":"门","b":"口","w":"问","py":"wèn","ic":"❓","c":2,"q":{"en":"to ask","es":"preguntar"},"s":{"en":"Careful — 门 here is not a door. It is the sound. mén gives you wèn; only 口 mouth carries the meaning.","zh":"注意 —— 这里的「门」不表示门，表示读音。mén 给出 wèn；只有「口」管意思。","ja":"注意：ここの「门」は意味ではなく音（mén → wèn）です。","es":"Ojo: 门 no es puerta, es el sonido. Solo 口 aporta significado."}},{"a":"门","b":"耳","w":"闻","py":"wén","ic":"👃","c":2,"q":{"en":"to hear of, to smell","es":"oler"},"s":{"en":"Same trick as 问. 耳 ear carries the meaning; 门 only supplies the sound, mén → wén.","zh":"和「问」一个套路。「耳」管意思，「门」只提供读音 mén → wén。","ja":"「问」と同じ仕組みです。","es":"El mismo truco que 问."}},{"a":"门","b":"马","w":"闯","py":"chuǎng","ic":"💨","c":2,"q":{"en":"to burst in","es":"irrumpir"},"s":{"en":"A horse coming out through a gate. This one really is a picture.","zh":"一匹马从门里冲出来。这个字是真的画面。","ja":"門から馬が飛び出す。これは本当に絵です。","es":"Un caballo saliendo por la puerta. Este sí es un dibujo."}},{"a":"忄","b":"亡","w":"忙","py":"máng","ic":"😵‍💫","c":2,"q":{"en":"busy","es":"ocupado"},"s":{"en":"Heart on the left, 亡 on the right. You have probably seen what people say this means.","zh":"左边是心，右边是「亡」。你大概见过网上怎么解释这个字。","ja":"左が心、右が「亡」。ネットでの説明を見たことがあるかもしれません。","es":"Corazón a la izquierda, 亡 a la derecha. Seguro has visto lo que dicen que significa."}},{"a":"人","b":"口","w":"人口","py":"rénkǒu","ic":"👥","c":3,"q":{"en":"population","es":"población"},"s":{"en":"The number of mouths to feed.","zh":"要养活的嘴的数量，就是人口。","ja":"養う口の数。","es":"Las bocas que alimentar."}},{"a":"小","b":"心","w":"小心","py":"xiǎoxīn","ic":"⚠️","c":3,"q":{"en":"be careful","es":"ten cuidado"},"s":{"en":"Small heart. Nothing in the English hints at either part.","zh":"小的心。英文 careful 里没有任何一个音节暗示「小」或「心」。","ja":"小さい心。","es":"Corazón pequeño."}},{"a":"水","b":"目","w":"泪水","py":"lèishuǐ","ic":"😭","c":3,"q":{"en":"tears","es":"lágrimas"},"s":{"en":"Tear water. Careful — the parts are not what you think.","zh":"泪，和水。注意别拼错了。","ja":"涙の水。","es":"Agua de lágrimas."}},{"a":"明","b":"白","w":"明白","py":"míngbai","ic":"💡","c":3,"q":{"en":"to understand","es":"entender"},"s":{"en":"Bright plus white. The character you built in chapter one, used again.","zh":"明 加 白。你第一章造的那个字，又用上了。","ja":"明＋白。第1章で作った字がまた出てきます。","es":"Brillante más blanco. El carácter que construiste en el capítulo uno."}},{"a":"出","b":"口","w":"出口","py":"chūkǒu","ic":"🚪","c":3,"q":{"en":"the exit","es":"la salida"},"s":{"en":"Go out, plus mouth. A mouth is any opening, not just the one on your face.","zh":"出，加口。「口」是任何一个开口，不只是脸上那个。","ja":"出＋口。「口」は顔の口だけでなく、あらゆる開口部です。","es":"Salir más boca. Una boca es cualquier abertura, no solo la de tu cara."}},{"a":"东","b":"西","w":"东西","py":"dōngxi","ic":"📦","c":3,"q":{"en":"a thing, stuff","es":"una cosa"},"s":{"en":"East plus west. That is the ordinary Chinese word for a thing.","zh":"东 加 西。这就是中文里最普通的那个「东西」。","ja":"東＋西。これが中国語で「もの」を指す日常語です。","es":"Este más oeste. Esa es la palabra china corriente para una cosa."}},{"a":"银","b":"河","w":"银河","py":"yínhé","ic":"🌌","c":4,"q":{"en":"the milky way","es":"vía láctea"},"s":{"en":"Silver river. English sees milk; Chinese sees silver. Same band of stars, two different minds.","zh":"银 ＋ 河。英文管它叫「牛奶路」，中文看见的是银子。同一条东西，两边想的完全不一样。","ja":"銀の川。英語は「ミルク」、日本語は「天の川」。","es":"Río de plata. El inglés ve leche; el chino ve plata."},"t":["银","河","奶","路","星","天","白","水"]},{"a":"电","b":"影","w":"电影","py":"diànyǐng","ic":"🎬","c":4,"q":{"en":"a movie","es":"película"},"s":{"en":"Electric shadow. English named the motion; Chinese named the shadow.","zh":"电 ＋ 影。英文 movie 的词根是「动」，中文选的是「影」。一百年前造的词，今天看还是准的。","ja":"電気の影。日本語は「映画」。","es":"Sombra eléctrica."},"t":["电","影","光","画","声","火","车","快"]},{"a":"火","b":"车","w":"火车","py":"huǒchē","ic":"🚂","c":4,"q":{"en":"a train","es":"tren"},"s":{"en":"Fire vehicle. More honest than English train, which just means to drag.","zh":"火 ＋ 车。英文 train 的意思其实是「拖拽」，中文选的是驱动它的东西。","ja":"火の車。","es":"Vehículo de fuego."},"t":["火","车","铁","快","长","马","路","大"]},{"a":"河","b":"马","w":"河马","py":"hémǎ","ic":"🦛","c":4,"q":{"en":"a hippopotamus","es":"hipopótamo"},"s":{"en":"River horse. Hippopotamus is Greek for river horse too — Chinese just does not make you learn Greek first.","zh":"河 ＋ 马。有意思的是 hippopotamus 在希腊语里也是「河马」，只是你得先会希腊语才看得见。","ja":"川の馬。","es":"Caballo de río."},"t":["河","马","水","牛","大","猪","山","长"]},{"a":"松","b":"鼠","w":"松鼠","py":"sōngshǔ","ic":"🐿️","c":4,"q":{"en":"a squirrel","es":"ardilla"},"s":{"en":"Pine mouse. Chinese named where it lives; English borrowed Greek for shadow-tail.","zh":"松 ＋ 鼠。中文按它住哪儿命名；英文 squirrel 来自希腊语「影子尾巴」。","ja":"松のねずみ。","es":"Ratón de pino."},"t":["松","鼠","木","猫","小","山","长","大"]},{"a":"袋","b":"鼠","w":"袋鼠","py":"dàishǔ","ic":"🦘","c":4,"q":{"en":"a kangaroo","es":"canguro"},"s":{"en":"Pocket mouse. Once you have 鼠, half the animal kingdom opens up.","zh":"袋 ＋ 鼠。有了「鼠」这块，半个动物园都能拼出来。","ja":"袋のねずみ。","es":"Ratón de bolsa."},"t":["袋","鼠","跳","大","马","长","山","水"]},{"a":"海","b":"豚","w":"海豚","py":"hǎitún","ic":"🐬","c":4,"q":{"en":"a dolphin","es":"delfín"},"s":{"en":"Sea pig. Not a fish, and Chinese says so. Careful: sea + fish is also a real word.","zh":"海 ＋ 豚。中文认得清它不是鱼。注意：海 + 鱼 也是真词（海鱼）。","ja":"海の豚。","es":"Cerdo de mar."},"t":["海","豚","鱼","水","猪","大","马","长"]},{"a":"熊","b":"猫","w":"熊猫","py":"xióngmāo","ic":"🐼","c":4,"q":{"en":"a panda","es":"panda"},"s":{"en":"Bear cat. English took the word from Nepali; Chinese just described it.","zh":"熊 ＋ 猫。英文 panda 借自尼泊尔语，是个音；中文直接说它长什么样。","ja":"熊の猫。","es":"Oso gato."},"t":["熊","猫","黑","白","大","竹","山","马"]},{"a":"火","b":"鸡","w":"火鸡","py":"huǒjī","ic":"🦃","c":4,"q":{"en":"a turkey","es":"pavo"},"s":{"en":"Fire chicken, for the red wattle. English named it after a country it never came from.","zh":"火 ＋ 鸡 —— 说的是它脖子上那团红。英文 turkey 是拿一个跟它毫无关系的国家命名的。","ja":"火の鶏。","es":"Pollo de fuego."},"t":["火","鸡","鸟","肉","大","山","土","红"]},{"a":"眼","b":"镜","w":"眼镜","py":"yǎnjìng","ic":"👓","c":4,"q":{"en":"glasses","es":"gafas"},"s":{"en":"Eye mirror. Note 眼 and 目 both mean eye — 目 is the ancient one, 眼 is the one you use.","zh":"眼 ＋ 镜。注意 眼 和 目 都是眼睛：目 是古的那个，眼 是你日常用的那个。","ja":"目の鏡。","es":"Espejo de ojo."},"t":["眼","镜","目","水","面","小","光","白"]},{"a":"地","b":"铁","w":"地铁","py":"dìtiě","ic":"🚇","c":4,"q":{"en":"the subway, the metro","es":"metro"},"s":{"en":"Ground iron. English named the tunnel; Chinese named the rails. Three traps here are real words.","zh":"地 ＋ 铁。英文说的是「地下的路」，中文说的是「地下的铁」。这题三个陷阱都是真词。","ja":"地の鉄。","es":"Hierro de tierra."},"t":["地","铁","车","下","路","道","火","快"]},{"a":"电","b":"脑","w":"电脑","py":"diànnǎo","ic":"💻","c":4,"q":{"en":"a computer","es":"ordenador"},"s":{"en":"Electric brain. English named the job; Chinese named the organ it replaces.","zh":"电 ＋ 脑。英文 computer 说的是「计算的东西」，中文说的是「电做的脑子」。","ja":"電気の脳。","es":"Cerebro eléctrico."},"t":["电","脑","机","心","手","子","快","小"]},{"a":"冰","b":"箱","w":"冰箱","py":"bīngxiāng","ic":"🧊","c":4,"q":{"en":"a fridge","es":"nevera"},"s":{"en":"Ice box. English called it that too, a century ago, then changed its mind.","zh":"冰 ＋ 箱。英文一百年前也叫它 icebox，后来改口了，中文没改。","ja":"氷の箱。","es":"Caja de hielo."},"t":["冰","箱","冷","水","门","白","小","大"]},{"a":"口","b":"红","w":"口红","py":"kǒuhóng","ic":"💄","c":4,"q":{"en":"lipstick","es":"lápiz labial"},"s":{"en":"Mouth red. English named the object; Chinese named the result.","zh":"口 ＋ 红。英文说的是那根「棒」，中文说的是抹上去之后的「红」。","ja":"口の赤。","es":"Rojo de boca."},"t":["口","红","笔","色","美","手","小","白"]}];/*</Q>*/

 xing:{en:'phono-semantic',zh:'形声',ja:'形声',es:'fono-semántico'},

function E(k,se,sz,sj,ss,xe,xz,xj,xs){return {k:k,s:{en:se,zh:sz,ja:sj,es:ss},x:{en:xe,zh:xz,ja:xj,es:xs}};}
/*<EX>*/var EX={"明":{"k":"hui","s":{"en":"The two brightest things in the sky, stacked.","zh":"把天上最亮的两样东西叠在一起。","ja":"空で最も明るい二つを重ねました。","es":"Las dos cosas más brillantes del cielo, juntas."},"x":{"en":"Chinese then uses this character for understanding: 明白, bright + white, means \"I get it\". English reaches for the same thing without noticing — I see, it is clear to me, that sheds light on it. Two unrelated languages, one instinct: knowing is light.","zh":"中文接着用它表示「懂了」：明白。英语其实干了一模一样的事而自己没发觉 —— I see、it is clear、that sheds light on it。两门毫无关系的语言，同一个直觉：懂得就是看见光。","ja":"中国語はこの字で「わかる」を表します：明白。英語も I see と言います。理解は光。","es":"Luego el chino usa este carácter para entender: 明白, brillante + blanco. El inglés hace lo mismo: I see, it is clear."}},"林":{"k":"hui","s":{"en":"One more tree.","zh":"再加一棵树。","ja":"木をもう一本。","es":"Un árbol más."},"x":{"en":"English needs three unrelated words for this — tree, woods, forest — and none of them look like the others. Chinese just draws another tree. Same move elsewhere: 人 person → 从 follow → 众 crowd.","zh":"英语在这里需要三个毫不相干的词 —— tree、woods、forest，谁也不像谁。中文只是又画了一棵树。同一招还用在：人 → 从 → 众。","ja":"英語は tree、woods、forest と無関係な三語が必要です。中国語は木を増やすだけ。","es":"El inglés necesita tres palabras sin relación: tree, woods, forest. El chino solo dibuja otro árbol."}},"森":{"k":"hui","s":{"en":"Three trees — but 森 does not mean many trees. It means dense enough to go dark.","zh":"三棵树 —— 但「森」不是树多，是密到发暗。","ja":"木が三本。ただし「森」は数ではなく、暗くなるほどの密さです。","es":"Tres árboles, pero 森 no es cantidad: es tan denso que oscurece."},"x":{"en":"So 阴森 means eerie and 森严 means forbidding. English feels it too — every fairy tale sends the child into the woods, never into the trees. Chinese just put the dread inside the character.","zh":"所以「阴森」是疹人，「森严」是让人不敢靠近。英语里也有这个感觉 —— 每个童话都把孩子送进 into the woods，从来不是 into the trees。中文把那份发毛直接写进了字里。","ja":"だから「阴森」は不気味。英語も童話では into the woods と言います。","es":"Por eso 阴森 es siniestro. En inglés los cuentos mandan al niño into the woods, nunca into the trees."}},"炎":{"k":"hui","s":{"en":"Fire on top of fire.","zh":"火叠着火。","ja":"火の上に火。","es":"Fuego sobre fuego."},"x":{"en":"You will meet this at the doctor: 发炎 is inflammation, 肺炎 is pneumonia. Now look at the English word: inflammation comes from Latin flamma, flame. Two civilisations looked at a swollen joint and both said: fire.","zh":"你会在医院遇到它：发炎、肺炎。现在看英文那个词 —— inflammation 来自拉丁语 flamma，火焰。两个文明看着同一个肿痛的关节，都说：火。","ja":"病院で出会います：发炎、肺炎。英語の inflammation もラテン語の「炎」からです。","es":"Lo verás en medicina: 发炎. Y inflamación viene del latín flamma: llama. Dos civilizaciones dijeron fuego."}},"尘":{"k":"hui","s":{"en":"Small earth.","zh":"小的土。","ja":"小さい土。","es":"Tierra pequeña."},"x":{"en":"The older form is 塵 — a deer 鹿 standing on earth 土: the cloud thrown up by a running herd. Someone three thousand years ago decided dust was best explained by animals you could hear coming.","zh":"更早的写法是「塵」—— 上面一头鹿，下面一块土：鹿群奔跑扬起的那片土。三千年前有人决定，解释「尘」最好的方式是一群你能听见的动物。","ja":"古い形は「塵」。鹿の群れが巶き上げる土ぼこりです。","es":"La forma antigua es 塵: un ciervo sobre tierra, el polvo que levanta la manada."}},"尖":{"k":"hui","s":{"en":"Small on top of big. The character is a drawing of a triangle.","zh":"上小下大。这个字就是一个三角形的图。","ja":"上が小さく下が大きい。字そのものが三角形です。","es":"Pequeño sobre grande: el carácter es el dibujo de un triángulo."},"x":{"en":"This one is a newcomer — the great Han-dynasty dictionary does not have it. For centuries the word for sharp was a complicated character nobody enjoyed writing. Someone drew the obvious picture instead, and everyone quietly switched.","zh":"这是个新字 —— 汉代的《说文解字》里根本没有它。古人说「尖」用的是一个没人愿意写的复杂字。后来有人直接画了那个显而易见的图，大家就默默换了过去。","ja":"新しい字で、『説文解字』にはありません。誰かが絵を描いて定着しました。","es":"Es tardío: el gran diccionario Han no lo tiene. Alguien dibujó lo obvio y todos cambiaron."}},"泪":{"k":"hui","s":{"en":"Water at the eye. Those three strokes on the left are 水 squeezed thin — you will see them on every liquid.","zh":"眼睛上的水。左边那三点是被挤扁的「水」，所有跟液体有关的字都带着它。","ja":"目のところの水。左の三点は「水」です。","es":"Agua en el ojo. Los tres trazos son 水 comprimido."},"x":{"en":"Try it right now on any character with those three strokes: 河 river, 海 sea, 汗 sweat, 酒 alcohol. Four for four. This is the closest thing Chinese has to a spelling rule, and it is more reliable than English silent letters.","zh":"现在就去验证：凡是带着那三点的字 —— 河、海、汗、酒。四次四中。这是中文里最接近「拼写规则」的东西，而且比英语的不发音字母靠谱得多。","ja":"今すぐ試して：河、海、汗、酒。四つとも液体です。","es":"Compruébalo ahora: 河 río, 海 mar, 汗 sudor, 酒 alcohol. Cuatro de cuatro."}},"休":{"k":"hui","s":{"en":"A person leaning against a tree.","zh":"一个人靠在一棵树上。","ja":"人が木にもたれている。","es":"Una persona apoyada en un árbol."},"x":{"en":"Now look at the left half of the modern character: that vertical stroke with the little flick is still the person. Three thousand years, one nap, never got up. English rest comes from an Old English word for a bed — true, but you cannot see a bed in r-e-s-t.","zh":"现在看现代字的左半边：那一竖加一撇，还是那个人。三千年一觉，他一直没起来。英语 rest 来自古英语的「床」—— 是真的，但你在 r-e-s-t 里看不到任何一张床。","ja":"現代字の左半分、あの縦棒がまだ「人」です。三千年起きていません。","es":"Mira la mitad izquierda del carácter moderno: ese trazo sigue siendo la persona."}},"从":{"k":"hui","s":{"en":"One person walking behind another.","zh":"一个人走在另一个人后面。","ja":"人が人の後ろを歩く。","es":"Una persona detrás de otra."},"x":{"en":"Add a third and you get 众, a crowd. So Chinese counts people the way it counts trees: one, two, many. English switches words every time — person, pair, crowd — and hides the pattern.","zh":"再加一个就是「众」。中文数人和数树是同一套办法：一个、两个、一堆。英语每次都换一个词 —— person、pair、crowd —— 把规律藏了起来。","ja":"もう一人加えると「众」（群衜）。木と同じ数え方です。","es":"Añade uno más y tienes 众, multitud. El chino cuenta personas como cuenta árboles."}},"好":{"k":"hui","s":{"en":"A woman and a child.","zh":"一个女人，一个孩子。","ja":"女と子。","es":"Una mujer y un niño."},"x":{"en":"The pretty reading is a mother holding her child. Scholars do not actually agree. We are telling you because a lot of apps sell you the pretty version as fact — and the truth is that some characters are three thousand years old and nobody was taking notes.","zh":"好听的那个解释是「母亲抱着孩子」。学界并没有定论。我们特意说明，是因为很多产品会把好听的那个当成事实卖给你 —— 而事实是，有些字已经三千岁了，当时没人做笔记。","ja":"通説は「母が子を抱く」ですが、定説はありません。","es":"La lectura bonita es una madre con su hijo. No hay consenso. Algunos caracteres tienen tres mil años y nadie tomaba notas."}},"看":{"k":"hui","s":{"en":"A hand above an eye — the gesture you make to see into the distance.","zh":"手搭在眼睛上方 —— 遮着阳光往远处望的那个动作。","ja":"手を目の上に。遠くを見る仕草です。","es":"Una mano sobre el ojo, el gesto de mirar lejos."},"x":{"en":"Look at the oracle-bone 目 above: it is lying down, shaped like an actual eye. Every 目 used to be horizontal. When Chinese started being written in vertical columns, the eye was tipped on its end to fit — and it never lay back down.","zh":"看上面那个甲骨文的「目」：它是横着的，像一只真的眼睛。所有的「目」本来都是横的 —— 后来中文改成竖着写，眼睛为了塞进竖行被立了起来，从此再没躺回去。","ja":"上の甲骨文の「目」は横向き、本物の目の形です。縦書きに合わせて立てられました。","es":"Mira el 目 oracular: está tumbado, como un ojo real. Se puso de pie para caber en la columna vertical."}},"问":{"k":"xing","s":{"en":"Careful — 门 here is not a door. It is the sound. mén gives you wèn; only 口 mouth carries the meaning.","zh":"注意 —— 这里的「门」不表示门，表示读音。mén 给出 wèn；只有「口」管意思。","ja":"注意：ここの「门」は意味ではなく音（mén → wèn）です。","es":"Ojo: 门 no es puerta, es el sonido. Solo 口 aporta significado."},"x":{"en":"About 80% of Chinese characters work like this: half for meaning, half for sound. English does it too — the ph in phone tells you nothing about telephones, it just says \"this word came from Greek, pronounce it /f/\". Anyone who tells you every character is a little picture is selling you something.","zh":"大约 80% 的汉字都是这么造的：一半管意思，一半管声音。英语也干同样的事 —— phone 里的 ph 完全不告诉你电话是什么，它只是在说「这个词来自希腊语，读 /f/」。谁要是告诉你每个汉字都是一幅画，那是在卖东西给你。","ja":"漢字の約80%がこの方式です。英語の phone の ph も同じで、意味ではなく音の印です。","es":"Cerca del 80% funciona así. El inglés hace igual: el ph de phone solo dice \"vino del griego, suénalo /f/\"."}},"闻":{"k":"xing","s":{"en":"Same trick as 问. 耳 ear carries the meaning; 门 only supplies the sound, mén → wén.","zh":"和「问」一个套路。「耳」管意思，「门」只提供读音 mén → wén。","ja":"「问」と同じ仕組みです。","es":"El mismo truco que 问."},"x":{"en":"This character drifted. It used to mean hear, and still does inside 新闻, news — literally new-things-heard. On its own it now usually means to smell. English did the same to smart: it meant painful for centuries before it meant clever.","zh":"这个字的意思漂移过：本义是「听」，「新闻」里还是这个意思 —— 字面就是「新听到的事」。但单用的时候，现代汉语里通常是「嗅」。英语的 smart 也一样 —— 它先当了好几个世纪的「疼」，才变成「聪明」。","ja":"意味が移りました。本義は「聞く」で「新闻」に残り、単独では今は「嗅ぐ」です。","es":"Antes significaba oír, y sigue así en 新闻 (noticias). Solo, hoy suele ser oler."}},"闯":{"k":"hui","s":{"en":"A horse coming out through a gate. This one really is a picture.","zh":"一匹马从门里冲出来。这个字是真的画面。","ja":"門から馬が飛び出す。これは本当に絵です。","es":"Un caballo saliendo por la puerta. Este sí es un dibujo."},"x":{"en":"Three characters, same 门: in 问 and 闻 it is only a sound, in 闯 it is the meaning. That is the whole difficulty of Chinese in one gate — you cannot tell which job a part is doing until you know the word. The oldest dictionary, from the year 121, defines 闯 in five words: \"the look of a horse leaving a gate\".","zh":"三个字都带「门」：问、闻 里它只是个声音，闯 里它是意思。中文的全部难处就在这扇门里 —— 在你认识这个词之前，你看不出部件在干哪份工。公元 121 年的《说文解字》给「闯」的解释只有四个字：「马出门貌」。","ja":"同じ「门」でも、问・闻 は音、闯 は意味。121年の辞書は「馬出門貌」と定義します。","es":"Tres caracteres, el mismo 门: en 问 y 闻 es sonido; en 闯, significado. El diccionario del año 121 lo define en cinco palabras."}},"忙":{"k":"xing","s":{"en":"Heart on the left, 亡 on the right. You have probably seen what people say this means.","zh":"左边是心，右边是「亡」。你大概见过网上怎么解释这个字。","ja":"左が心、右が「亡」。ネットでの説明を見たことがあるかもしれません。","es":"Corazón a la izquierda, 亡 a la derecha. Seguro has visto lo que dicen que significa."},"x":{"en":"The internet will tell you busy is heart 忄 plus death 亡 — so busy your heart is dying. It is everywhere, and it is not true. 亡 is here for the sound: wáng gives you máng. It carries no meaning at all. The same goes for the famous one about crisis meaning danger plus opportunity — a sinologist at Penn has spent years trying to kill that one. Chinese is full of real poetry. It does not need the invented kind.","zh":"网上会告诉你：忙 = 心 + 亡，忙到心都死了。这条到处都是，而且是编的。「亡」在这里只提供读音，wáng → máng，不带任何意思。同样有名的还有「危机 = 危险 + 机会」，宾大的汉学家为了辟这个谣写了很多年。中文里真的诗意已经够多了，不需要编的那种。","ja":"ネットでは「忙＝心＋亡、心が死ぬほど忙しい」と説明されます。よく見かけますが、事実ではありません。「亡」は音（wáng→máng）のためだけにあります。「危机＝危険＋機会」も同様に有名な誤りです。","es":"Internet te dirá que ocupado es corazón 忄 más muerte 亡. Está por todas partes y es falso: 亡 está por el sonido, wáng da máng. Lo mismo pasa con eso de que crisis es peligro más oportunidad."}},"明白":{"k":"ci","s":{"en":"Bright plus white. The character you built in chapter one, used again.","zh":"明 加 白。你第一章造的那个字，又用上了。","ja":"明＋白。第1章で作った字がまた出てきます。","es":"Brillante más blanco. El carácter que construiste en el capítulo uno."},"x":{"en":"Understanding, in Chinese, is a lighting condition. And English does exactly the same thing without noticing: I see. It is clear to me. That sheds light on it. Now it dawns on me. Four idioms, all about light, none of them literal. Two languages that never met agreed that knowing is brightness.","zh":"在中文里，「懂了」是一种光照条件。而英语干着一模一样的事却毫无自觉：I see、it is clear、that sheds light on it、now it dawns on me —— 四个习语全是光，没有一个是字面意思。两门从未谋面的语言，都认定「知道」就是「亮」。","ja":"中国語では「わかる」は明るさの状態です。英語も同じで、I see、it is clear、it dawns on me はすべて光の比喩です。出会ったことのない二つの言語が、同じ結論に達しました。","es":"Entender, en chino, es una condición de luz. Y el inglés hace lo mismo sin darse cuenta: I see, it is clear, it dawns on me. Dos lenguas que nunca se encontraron decidieron que saber es luz."}},"出口":{"k":"ci","s":{"en":"Go out, plus mouth. A mouth is any opening, not just the one on your face.","zh":"出，加口。「口」是任何一个开口，不只是脸上那个。","ja":"出＋口。「口」は顔の口だけでなく、あらゆる開口部です。","es":"Salir más boca. Una boca es cualquier abertura, no solo la de tu cara."},"x":{"en":"This is the first word you will actually read in the wild. It is above every exit in every station in China, in white on green, exactly where the English sign would be. Flip it to 入口 and you have the entrance. Two characters, and you can now navigate a subway.","zh":"这会是你在真实世界里读到的第一个词。中国每个车站的每个出口上方都写着它，绿底白字，位置和英文标识一模一样。把它翻过来变成「入口」，就是进站口。两个字，你已经能在地铁里认路了。","ja":"実際に街で最初に読める語です。中国のあらゆる駅の出口に、緑地に白でこう書いてあります。「入口」にすれば入り口。二字で地下鉄を歩けます。","es":"Es la primera palabra que leerás en el mundo real. Está sobre cada salida de cada estación en China, blanco sobre verde. Dale la vuelta y tienes 入口, la entrada."}},"东西":{"k":"ci","s":{"en":"East plus west. That is the ordinary Chinese word for a thing.","zh":"东 加 西。这就是中文里最普通的那个「东西」。","ja":"東＋西。これが中国語で「もの」を指す日常語です。","es":"Este más oeste. Esa es la palabra china corriente para una cosa."},"x":{"en":"Nobody is certain why. The best-known story says old markets ran east and west, so what you bought was east-west. Historians are not convinced. What is certain is that a billion people say it every day without ever thinking about it — the way English speakers say goodbye without hearing God be with you inside it. Every language is full of fossils its own speakers walk past.","zh":"没人完全确定为什么。流传最广的说法是古时集市分东市西市，买回来的就叫「东西」。史学界并不买账。确定的是：十几亿人每天说这个词，从来没想过它是什么意思 —— 就像英语母语者说 goodbye 时，听不见里面藏着的 God be with you。每种语言都有自己人天天路过却看不见的化石。","ja":"理由は誰にも断定できません。有名な説では、昔の市が東西に分かれていたからだと言います。確かなのは、十数億人が毎日この語を使い、一度も考えたことがないという事実です。英語話者が goodbye の中の God be with you を聞かないのと同じです。","es":"Nadie sabe con certeza. La historia más conocida dice que los mercados antiguos iban de este a oeste. Lo cierto es que mil millones de personas lo dicen a diario sin pensarlo, igual que los angloparlantes dicen goodbye sin oír God be with you."}}};/*</EX>*/

  q('sh-x').textContent=t.close;
  q('sheet').style.display='flex';}
function modeChs(){var o=[];CH.forEach(function(h,i){if(h.k===MODE)o.push(i);});return o;}
function modeAll(){var o=[];modeChs().forEach(function(i){o=o.concat(chQ(i));});return o;}
function modeSolved(){return modeAll().filter(function(x){return solved[x.w];}).length;}
function chNo(c){return modeChs().indexOf(c)+1;}
function q(id){return document.getElementById(id);}
/*<DIFF>*/var DIFF={"明":1,"林":1,"森":2,"炎":1,"尘":2,"尖":3,"泪":2,"火山":1,"山水":2,"森林":1,"明月":2,"明日":3,"尘土":2,"休":2,"从":2,"好":2,"看":1,"问":3,"闻":3,"闯":2,"忙":3,"人口":3,"小心":3,"泪水":2,"明白":2,"出口":1,"东西":3,"银河":3,"电影":3,"火车":2,"河马":2,"松鼠":2,"袋鼠":3,"海豚":3,"熊猫":2,"火鸡":2,"眼镜":3,"地铁":3,"电脑":2,"冰箱":2,"口红":3};/*</DIFF>*/
function dOf(p){return DIFF[p.w]||2;}
function nTiles(p){return dOf(p)===1?4:(dOf(p)===2?6:8);}
function chQ(c){return Q.filter(function(x){return x.c===c;}).slice().sort(function(a,b){return dOf(a)-dOf(b);});}
function chDone(c){return chQ(c).every(function(x){return solved[x.w];});}
function chLabel(c){var h=CH[c];return t.chap+' '+chNo(c)+' · '+h.t[lang];}
function known(){var o={};Q.forEach(function(x){if(solved[x.w])o[x.w]=1;});return o;}
function rnd(seed){var x=seed*9301%233280;return function(){x=(x*9301+49297)%233280;return x/233280;};}
function tilesFor(p,idx){
  var N=nTiles(p);
  if(p.t)return shuffle(p.t.slice(0,N),idx);
  var pool=CH[p.c].pool.concat(Object.keys(known())),out=[p.a];
  if(p.b!==p.a)out.push(p.b);
  var r=rnd(idx+7),cand=pool.filter(function(x){return out.indexOf(x)<0;});
  while(out.length<N&&cand.length){var j=Math.floor(r()*cand.length);out.push(cand.splice(j,1)[0]);}
  return shuffle(out,idx);}
function shuffle(arr,seed){var a=arr.slice(),r=rnd(seed+13);
  for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var m=a[i];a[i]=a[j];a[j]=m;}return a;}
function gloss(ch){var g=B[ch],py=(lang==='zh'||lang==='ja');
  if(g)return py?g[5]:g[LI[lang]];
  for(var i=0;i<Q.length;i++)if(Q[i].w===ch)return py?Q[i].py:Q[i].q.en;return '';}
function mark(ch){var g=B[ch];
  if(g&&g[0])return '<span class="em">'+g[0]+'</span>';
  if(IC[ch])return '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">'+IC[ch]+'</svg>';
  for(var i=0;i<Q.length;i++)if(Q[i].w===ch){var c=Q[i].ic;
    if(c.charAt(0)==='§')return '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">'+(IC[c.slice(1)]||'')+'</svg>';
    return '<span class="em">'+c+'</span>';}
  return '<span class="em"></span>';}
function face(ch){return mark(ch)+'<span class="gl'+(ch.length>1?' w':'')+'">'+ch+'</span><span class="gs">'+gloss(ch)+'</span>';}
function toast(m){var e=q('toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},1700);}
function copy(txt){var d=function(){toast(t.copied);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(d,function(){fb(txt,d);});else fb(txt,d);}
function fb(txt,cb){var a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;top:0;opacity:0';
  document.body.appendChild(a);a.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(a);}

function cur(){return chQ(ci)[qi];}
function firstUnsolved(c){var list=chQ(c);for(var i=0;i<list.length;i++)if(!solved[list[i].w])return i;return 0;}
function load(){
  var p=cur();sel=[];tries=[];over=false;shown=0;
  var d=dOf(p),dots='';for(var i=1;i<=3;i++)dots+='<i class="dot'+(i<=d?' on':'')+'"></i>';
  q('lv').innerHTML=chLabel(ci)+'<span class="dots" title="'+t.diff[d-1]+'">'+dots+'</span>';
  q('sub').textContent=CH[ci].k==='char'?t.tchar:t.tword;
  q('target').textContent=lang==='es'?p.q.es:p.q.en;
  var lk=layOf(p);
  q('board').className='board'+(lk==='tb'?' tb':'');
  q('shape').innerHTML=layIcon(lk)+'<span>'+t.lay[lk]+'</span>';
  q('rows').innerHTML='';q('reveal').innerHTML='';q('check').disabled=false;
  q('reveal').style.display='none';q('puzzle').style.display='block';
  coach(taught<1?0:3);
  q('check').textContent=t.check;q('hintb').textContent=t.hintb;q('hintb').style.display='none';shown=0;
  var tray=q('tray');tray.innerHTML='';
  tilesFor(p,ci*100+qi).forEach(function(ch){
    var b=document.createElement('button');b.innerHTML=face(ch);
    b.onclick=function(){if(over||sel.length>=2)return;sel.push(ch);slots();};
    tray.appendChild(b);});
  slots();progress();}
function slots(){[0,1].forEach(function(i){var e=q('s'+i);e.innerHTML=sel[i]?face(sel[i]):'';
  e.onclick=function(){if(over||!sel[i])return;sel.splice(i,1);slots();};});}
function progress(){
  var list=chQ(ci),n=list.filter(function(x){return solved[x.w];}).length;
  q('cnt').textContent=n;q('tot').textContent=list.length;
  q('bar').style.width=Math.round(n/list.length*100)+'%';
  q('m-char').innerHTML=t.mchar+'<span class="cn">'+t.tchar2+'</span>';
  q('m-word').innerHTML=t.mword+'<span class="cn">'+t.tword2+'</span>';
  drawColl();drawStrip();}
function drawColl(){var g=q('coll');g.innerHTML='';
  chQ(ci).forEach(function(p){var d=document.createElement('div');
    if(solved[p.w]){d.textContent=p.w;d.className='got'+(p.w.length>1?' w':'')+(p.w===justSolved?' pop':'');}
    else{d.textContent='？';d.className='lock';}
    g.appendChild(d);});}
function drawStrip(){var st=q('strip');st.innerHTML='';
  modeChs().forEach(function(i,k){var d=document.createElement('div');
    d.className='chip'+(i===ci?' now':'')+(chDone(i)?' ok':'');
    d.textContent=k+1;d.title=chLabel(i);
    d.style.cursor='pointer';d.onclick=function(){goCh(i);};
    st.appendChild(d);});}
var justSolved=null;
function goCh(c){ci=c;qi=firstUnsolved(c);q('donebox').innerHTML='';load();window.scrollTo(0,0);}
function setMode(m){
  MODE=m;
  q('m-char').setAttribute('aria-selected',m==='char');
  q('m-word').setAttribute('aria-selected',m==='word');
  var chs=modeChs(),target=chs[0];
  for(var i=0;i<chs.length;i++){if(!chDone(chs[i])){target=chs[i];break;}}
  goCh(target);}

function check(){
  if(over||sel.length<2)return;
  var p=cur(),need=[p.a,p.b].slice(),hit=0;
  sel.forEach(function(c){var k=need.indexOf(c);if(k>-1){need.splice(k,1);hit++;}});
  var kls=hit===2?'g':(hit===1?'a':'n'),lab=hit===2?t.kg:(hit===1?t.kh:t.kn);
  tries.push(hit===2?'🟩':(hit===1?'🟨':'⬜'));
  var r=document.createElement('div');r.className='row';
  r.innerHTML='<span class="gt '+kls+'">'+sel[0]+'</span><span class="gt '+kls+'">'+sel[1]+'</span><span class="rl '+kls+'">'+lab+'</span>';
  q('rows').appendChild(r);
  sel=[];slots();
  if(taught<1){taught=1;coach(1);}
  if(hit===2)finish(true);
  else if(tries.length>=6)finish(false);
  else{if(tries.length>=2&&shown<2)q('hintb').style.display='inline-block';
    if(!window.matchMedia||!matchMedia('(prefers-reduced-motion: reduce)').matches){
      var bd=q('rows');bd.classList.add('shake');setTimeout(function(){bd.classList.remove('shake');},320);}}}
function hint(){
  var p=cur(),d=document.createElement('div');d.className='hintbox';
  var who=OB[p.a]?p.a:(OB[p.b]?p.b:p.a);
  if(shown===0&&OB[who]){shown=1;
    d.innerHTML='<span class="hk">'+t.hint+' 1</span>'+t.hintOb
      +'<svg class="obhint" viewBox="0 0 24 24" aria-hidden="true">'+OB[who]+'</svg>';
    q('hintb').textContent=t.hintb2;}
  else{shown=2;q('hintb').style.display='none';
    d.innerHTML='<span class="hk">'+t.hint+' 2</span>'+t.hintName
      +' <b style="font-family:var(--f-han);font-size:20px">'+p.a+'</b> — '+gloss(p.a);}
  q('rows').appendChild(d);}
function finish(win){
  over=true;q('check').disabled=true;coach(2);
  var p=cur(),isNew=!solved[p.w];
  if(win){solved[p.w]=1;justSolved=isNew?p.w:null;}
  var head=win?t.solvedIt.replace('{n}',tries.length):t.failedIt;
  var last=win&&chDone(ci);
  var e=EX[p.w],body=e?e.s[lang]:p.s[lang],tag=TY[e?e.k:'ci'][lang];
  var kind=MODE==='char'?t.aChar:t.aWord;
  var cheer=win?(isNew?'<div class="cheer"><span class="st">'+t.stampNew+'</span>'
        +'<div class="tx">'+t.cheerNew.replace('{k}',kind)+'</div>'
        +'<div class="sb">'+t.solvedIt.replace('{n}',tries.length)+'</div></div>'
      :'<div class="cheer"><span class="st">'+t.stampOk+'</span><div class="tx">'+t.cheerAgain+'</div></div>')
    :'<div class="cheer no"><span class="st">'+t.stampNo+'</span><div class="tx">'+t.cheerFail+'</div>'
      +'<div class="sb">'+t.cheerFailSub+'</div></div>';
  q('reveal').innerHTML=cheer
    +'<div class="bigw"><span class="bg'+(p.w.length>1?' w':'')+'">'+p.w+'</span>'
      +'<div class="py">'+p.py+'</div><div class="mn">'+(lang==='es'?p.q.es:p.q.en)+'</div>'
      +'<span class="rvtag">'+tag+'</span></div>'
    +'<div class="card">'
      +'<div class="split">'
        +'<div class="pt">'+obOf(p.a)+'<b>'+p.a+'</b><span>'+gloss(p.a)+'</span></div>'
        +'<span class="op">＋</span>'
        +'<div class="pt">'+obOf(p.b)+'<b>'+p.b+'</b><span>'+gloss(p.b)+'</span></div></div>'
      +((OB[p.a]||OB[p.b])?'<div class="obl">'+t.oracle+'</div>':'')
      +'<div class="bd">'+body+'</div>'
      +(e?'<div class="lore"><span class="lk">'+t.lore+'</span>'+e.x[lang]+'</div>':'')
      +'<div class="share">字 '+head+'<br>'+tries.join('')+'</div></div>'
    +'<div class="acts">'+(last?'':'<button class="btn" id="nx">'+t.next+'</button>')
      +'<button class="btn ghost" id="sh">'+t.share+'</button></div>';
  q('puzzle').style.display='none';q('reveal').style.display='block';
  q('sh').onclick=function(){copy('字 · Hanzi\n'+(lang==='es'?p.q.es:p.q.en)+' → '+p.w+'\n'+tries.join('')+'\n'+location.href);};
  if(!last)q('nx').onclick=next;
  progress();justSolved=null;window.scrollTo(0,0);
  if(chDone(ci))setTimeout(chComplete,300);}
function nextCh(){var m=modeChs(),k=m.indexOf(ci);return k>=0&&k<m.length-1?m[k+1]:-1;}
function next(){
  var list=chQ(ci),k=qi;
  for(var i=1;i<=list.length;i++){var j=(qi+i)%list.length;if(!solved[list[j].w]){k=j;break;}}
  if(k===qi&&solved[list[qi].w]){var nc=nextCh();if(nc>-1&&chDone(ci)){goCh(nc);return;}}
  qi=k;load();window.scrollTo(0,0);}
function chComplete(){
  var nc=nextCh(),last=nc<0;
  q('donebox').innerHTML='<div class="done"><h3>'+(last?t.mDone.replace('{m}',MODE==='char'?t.mchar:t.mword):t.chDone)+'</h3><p>'+(last?t.dbody:chLabel(ci))+'</p>'
    +(last?'<button class="btn" id="swap">'+t.tryOther+'</button> <button class="btn ghost" id="allshare">'+t.share+'</button>'
          :'<button class="btn" id="cn">'+t.chNext+' · '+CH[nc].t[lang]+'</button>')+'</div>';
  if(last){q('swap').onclick=function(){setMode(MODE==='char'?'word':'char');};
    q('allshare').onclick=function(){var a=modeAll(),g='';a.forEach(function(x,i){g+='🟩';if((i+1)%7===0&&i+1<a.length)g+='\n';});
      copy('字 · Hanzi\n'+(MODE==='char'?t.mchar:t.mword)+' '+a.length+'/'+a.length+'\n'+g+'\n'+location.href);};}
  else q('cn').onclick=function(){goCh(nc);};
  window.scrollTo(0,0);}

function applyLang(){t=L[lang];document.documentElement.lang=lang;
  q('i-h').textContent=t.ih;q('i-p').textContent=t.ip;q('i-btn').textContent=t.ibtn;
  q('l-build').textContent=t.build;q('l-coll').textContent=t.coll;q('hintb').textContent=t.hintb;
  q('foot').textContent=t.foot;
  if(q('game').style.display!=='none')load();}
q('i-btn').onclick=function(){q('intro').style.display='none';q('game').style.display='block';
  q('modes').style.display='flex';q('help').style.display='block';setMode('char');};
q('help').onclick=rules;
q('sh-x').onclick=function(){q('sheet').style.display='none';};
q('sheet').onclick=function(e){if(e.target===this)this.style.display='none';};
q('m-char').onclick=function(){if(MODE!=='char')setMode('char');};
q('m-word').onclick=function(){if(MODE!=='word')setMode('word');};
q('check').onclick=check;q('hintb').onclick=hint;
var ls=q('lang');ls.value=lang;
ls.onchange=function(){lang=this.value;try{localStorage.setItem('hz-lang',lang);}catch(e){}applyLang();};
applyLang();
})();
</script>
