        +'<div class="tx">'+t.cheerNew.replace('{k}',kind)+'</div>'
        +'<div class="sb">'+t.solvedIt.replace('{n}',tries.length)+'</div></div>'
      :'<div class="cheer"><span class="st">'+t.stampOk+'</span><div class="tx">'+t.cheerAgain+'</div></div>')
    :'<div class="cheer no"><span class="st">'+t.stampNo+'</span><div class="tx">'+t.cheerFail+'</div>'
      +'<div class="sb">'+t.cheerFailSub+'</div></div>';
  q('reveal').className=win?'win':'lose';
  q('reveal').innerHTML=(win?RAYS:'')+cheer
    +'<div class="bigw"><span class="bg'+(p.w.length>1?' w':'')+'">'+p.w+'</span>'
      +'<div class="py">'+p.py+'</div><div class="mn">'+(lang==='es'?p.q.es:p.q.en)+'</div>'
      +'<span class="rvtag">'+tag+'</span></div>'
    +'<div class="card">'
      +'<div class="split">'
        +'<div class="pt">'+obOf(p.a)+'<b>'+p.a+'</b><span>'+gloss(p.a)+'</span></div>'
        +'<span class="op">＋</span>'
        +'<div class="pt">'+obOf(p.b)+'<b>'+p.b+'</b><span>'+gloss(p.b)+'</span></div></div>'
      +((OB[p.a]||OB[p.b])?'<div class="obl">'+t.oracle+'</div>':'')
      +'<div class="bd">'+body+'</div>'
      +(e?'<div class="lore"><span class="lk">'+t.lore+'</span>'+e.x[lang]+'</div>':'')
      +'<div class="share">字 '+head+'<br>'+tries.join('')+'</div></div>'
    +'<div class="acts">'+(last?'':'<button class="btn" id="nx">'+t.next+'</button>')
      +'<button class="btn ghost" id="sh">'+t.share+'</button></div>';
  q('puzzle').style.display='none';q('reveal').style.display='block';
  flashShake(win);
  if(win){play('chime');setTimeout(function(){play('stamp');},320);setTimeout(function(){play('scroll');},780);}
  else{play('wrong');setTimeout(function(){play('stamp');},320);}
  q('sh').onclick=function(){copy('墨 INK\n'+(lang==='es'?p.q.es:p.q.en)+' → '+p.w+'\n'+tries.join('')+'\n'+location.href);};
  if(!last)q('nx').onclick=next;
  progress();justSolved=null;window.scrollTo(0,0);
  if(chDone(ci))setTimeout(chComplete,300);}
function nextCh(){var m=modeChs(),k=m.indexOf(ci);return k>=0&&k<m.length-1?m[k+1]:-1;}
function next(){
  var list=chQ(ci),k=qi;
  for(var i=1;i<=list.length;i++){var j=(qi+i)%list.length;if(!solved[list[j].w]){k=j;break;}}
  if(k===qi&&solved[list[qi].w]){var nc=nextCh();if(nc>-1&&chDone(ci)){goCh(nc);return;}}
  qi=k;load();window.scrollTo(0,0);}

var RV=null;

function disposeRelic(){if(!RV)return;try{RV.stop=true;RV.renderer.dispose();}catch(e){}RV=null;}
function relicRR(T,w,h,r){var s=new T.Shape();
  s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);
  s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return s;}
function relicGoldTex(txt){var c=document.createElement('canvas');c.width=256;c.height=512;var x=c.getContext('2d');
  x.strokeStyle='#d4a95c';x.lineWidth=6;x.strokeRect(28,28,200,456);
  x.fillStyle='#e8d9a8';x.font='900 150px "Hanzi Serif","Songti SC",serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText(txt,128,240);return c;}
var RELIC_MAKERS=[
function(T,g){ // 墨锭
  var geo=new T.ExtrudeGeometry(relicRR(T,.9,2.2,.12),{depth:.4,bevelEnabled:true,bevelThickness:.07,bevelSize:.055,bevelSegments:4,curveSegments:20});

  f.position.z=.27;g.add(f);},
function(T,g){ // 砚台

  ring.position.y=-1.05;g.add(ring);
  var hair=new T.Mesh(new T.CylinderGeometry(.09,.13,.5,20),new T.MeshStandardMaterial({color:0xe9e2d0,roughness:.85}));

function(T,g){ // 卷轴

  paper.rotation.z=Math.PI/2;g.add(paper);
  var rod=new T.Mesh(new T.CylinderGeometry(.075,.075,3,20),new T.MeshStandardMaterial({color:0x5d3416,roughness:.5}));
  rod.rotation.z=Math.PI/2;g.add(rod);
  [-1.55,1.55].forEach(function(x){var cap=new T.Mesh(new T.SphereGeometry(.11,16,12),new T.MeshStandardMaterial({color:0xd4a95c,roughness:.3,metalness:.8}));
    cap.position.x=x;g.add(cap);});

function initRelic(idx){
  var host=q('relic');if(!host)return;
  dynImport('./three.module.js').then(function(T){
    host=q('relic');if(!host||RV)return;
    var W=host.clientWidth||300,H=220;
    var scene=new T.Scene();
    var cam=new T.PerspectiveCamera(36,W/H,.1,50);cam.position.set(0,.9,4.6);cam.lookAt(0,0,0);
    var r=new T.WebGLRenderer({antialias:true,alpha:true});
    r.setSize(W,H);r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    r.toneMapping=T.ACESFilmicToneMapping;host.appendChild(r.domElement);
    var key=new T.DirectionalLight(0xe8d9a8,2.4);key.position.set(3,4,3);scene.add(key);
    var rim=new T.DirectionalLight(0x7fc7a4,1.6);rim.position.set(-4,2,-3);scene.add(rim);
    scene.add(new T.AmbientLight(0x24443a,1.2));
    var g=new T.Group();scene.add(g);
    RELIC_MAKERS[idx%RELIC_MAKERS.length](T,g);
    var vx=.006,vy=0,drag=false,px=0,py=0,rx=-.08;
    host.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;});
    window.addEventListener('pointerup',function(){drag=false;});
    window.addEventListener('pointermove',function(e){if(!drag)return;
      vx=(e.clientX-px)*.006;vy=(e.clientY-py)*.006;px=e.clientX;py=e.clientY;});
    var st={renderer:r,stop:false};RV=st;
    g.rotation.y=-.35;g.rotation.x=-.08;
    r.render(scene,cam); // 同步首帧：后台窗口 rAF 冻结时也有画面
    function loop(t){if(st.stop)return;requestAnimationFrame(loop);
      if(document.hidden)return;
      if(!drag)vx+=(.006-vx)*.02;
      g.rotation.y+=vx;rx=Math.max(-.8,Math.min(.8,rx+vy));vy*=.88;g.rotation.x=rx;
      g.position.y=Math.sin(t*.001)*.05;r.render(scene,cam);}
    requestAnimationFrame(loop);
  }).catch(function(){var b=q('relicbox');if(b)b.style.display='none';});}
function chComplete(){
  disposeRelic();
  var nc=nextCh(),last=nc<0;
  q('donebox').innerHTML='<div class="done"><h3>'+(last?t.mDone.replace('{m}',MODE==='char'?t.mchar:t.mword):t.chDone)+'</h3><p>'+(last?t.dbody:chLabel(ci))+'</p>'
    +(last?'<button class="btn" id="swap">'+t.tryOther+'</button> <button class="btn ghost" id="allshare">'+t.share+'</button>'
          :'<button class="btn" id="cn">'+t.chNext+' · '+CH[nc].t[lang]+'</button>')+'</div>'
    +'<div class="relicbox" id="relicbox"><div id="relic"></div>'
    +'<div class="reliccap">'+t.relicGot+' · '+t.relics[ci%t.relics.length]+'</div>'
    +'<div class="relicwhy">'+t.relicWhy+'</div>'

        return '<span class="'+(chDone(i)?'on':'')+'">'+t.relics[i%t.relics.length]+'</span>';}).join('')
    +'</div></div>';
  if(last){q('swap').onclick=function(){setMode(MODE==='char'?'word':'char');};
    q('allshare').onclick=function(){var a=modeAll(),g='';a.forEach(function(x,i){g+='🟩';if((i+1)%7===0&&i+1<a.length)g+='\n';});

  initRelic(ci);
  window.scrollTo(0,0);}
